<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" role="img" aria-label="ReadWorks asks for natural narration, a full-word cue while the word is spoken, and a tap that replays from that word. The example sentence is made up."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="385" class="bg"/><text x="20" y="28" class="era">The requested read-along</text><rect x="20" y="63" width="720" height="94" class="sf"/><text x="35" y="92" class="b">ReadWorks supplies a passage and its audio.</text><text x="35" y="123" class="s">The new reader ties the spoken word to the printed word.</text><text x="20" y="205" class="b">What the new read-along should add</text><rect x="20" y="221" width="210" height="100" class="plate"/><text x="34" y="245" class="b s">Natural narration</text><path d="M34.0 284.2V285.8M37.4 284.2V285.8M40.8 284.2V285.8M44.2 282.1V287.9M47.6 277.1V292.9M51.0 274.4V295.6M54.4 276.6V293.4M57.8 272.8V297.2M61.2 277.1V292.9M64.6 275.7V294.3M68.0 274.5V295.5M71.4 274.9V295.1M74.8 273.4V296.6M78.2 273.1V296.9M81.6 277.0V293.0M85.0 281.1V288.9M88.4 284.2V285.8M91.8 284.2V285.8M95.2 284.2V285.8M98.6 284.2V285.8M102.0 281.6V288.4M105.4 277.7V292.3M108.8 277.6V292.4M112.2 278.8V291.2M115.6 271.2V298.8M119.0 275.2V294.8M122.4 277.1V292.9M125.8 274.0V296.0M129.2 269.8V300.2M132.6 272.8V297.2M136.0 277.0V293.0M139.4 275.1V294.9M142.8 277.7V292.3M146.2 280.4V289.6M149.6 283.4V286.6M153.0 284.2V285.8M156.4 284.2V285.8M159.8 284.2V285.8M163.2 281.4V288.6M166.6 278.4V291.6M170.0 274.8V295.2M173.4 276.7V293.3M176.8 276.5V293.5M180.2 272.2V297.8M183.6 272.2V297.8M187.0 276.4V293.6M190.4 271.4V298.6M193.8 270.9V299.1M197.2 273.2V296.8M200.6 278.6V291.4M204.0 277.0V293.0M207.4 281.7V288.3M210.8 284.2V285.8M214.2 284.2V285.8" class="bars"/><path d="M230 271H276" class="li-l" marker-end="url(#a-li)"/><rect x="280" y="221" width="250" height="100" class="plate"/><text x="294" y="262" class="print">She</text><rect x="334" y="240" width="68" height="28" class="lit"/><text x="339" y="262" class="print">found</text><text x="410" y="262" class="print">the old map.</text><text x="294" y="300" class="s mu">Full-word cue as it is spoken</text><path d="M530 271H576" class="li-l" marker-end="url(#a-li)"/><rect x="580" y="221" width="160" height="100" class="plate"/><text x="594" y="262" class="b s">Tap a word</text><text x="594" y="284" class="s mu">Replay from</text><text x="594" y="301" class="s mu">its start</text><text x="20" y="347" class="s">The example is made up. Earlier usage figures could not be confirmed.</text></svg>
