<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" role="img" aria-label="An optional signed API checks and cleans a passage submission, writes a job marker followed by an intake file, and that file starts audio generation. A later status call reads the job, manifest and audio objects. Published status supplies 15-minute links to the MP3 and speech marks, but does not prove reader publication or listening."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="414" class="bg"/><text x="20" y="27" class="era">Optional signed route, off by default</text><rect x="20" y="53" width="196" height="102" class="plate"/><text x="29" y="72" class="b s">Content system</text><text x="29" y="87" class="s mu">POST passage + ID</text><text x="29" y="102" class="s mu">GET status later</text><path d="M216 87H263" class="li-d" marker-end="url(#a-li)"/><text x="223" y="72" class="s li">signed</text><rect x="267" y="53" width="235" height="102" class="dash"/><text x="276" y="72" class="b s">Submission service</text><text x="276" y="87" class="s mu">Check size, ID, words, language</text><text x="276" y="102" class="s mu">Keep reader-safe fields</text><text x="276" y="117" class="s mu">Reject changed ID or force</text><path d="M502 87H548" class="li-d" marker-end="url(#a-li)"/><text x="514" y="72" class="s li">writes</text><rect x="552" y="53" width="188" height="102" class="plate"/><text x="564" y="80" class="s">api-jobs/&lt;id>.json</text><text x="564" y="101" class="s">then passages/&lt;id>.json</text><text x="564" y="122" class="s">File arrival starts audio</text><path d="M645 155V204H445" class="li-l" marker-end="url(#a-li)"/><rect x="230" y="208" width="305" height="60" class="sf"/><text x="244" y="233" class="b s">Job + manifest + audio objects</text><text x="244" y="253" class="s mu">read by the status call</text><path d="M230 238H176V288" class="li-d" marker-end="url(#a-li)"/><text x="184" y="270" class="xs li">job state</text><path d="M60 155V288" class="li-d" marker-end="url(#a-li)"/><text x="68" y="215" class="s li">GET status</text><rect x="20" y="292" width="720" height="83" class="plate"/><text x="34" y="316" class="b">Status reply</text><rect x="34" y="330" width="78" height="28" class="tile "/><text x="73" y="348.5" text-anchor="middle">queued</text><path d="M112 344H128" class="mu-l" marker-end="url(#a-mu)"/><rect x="130" y="330" width="78" height="28" class="tile "/><text x="169" y="348.5" text-anchor="middle">running</text><path d="M208 344H224" class="mu-l" marker-end="url(#a-mu)"/><rect x="226" y="330" width="86" height="28" class="tile "/><text x="269" y="348.5" text-anchor="middle">published</text><text x="326" y="349" class="s mu">or</text><rect x="346" y="330" width="56" height="28" class="tile bad"/><text x="374" y="348.5" class="b" text-anchor="middle">held</text><rect x="408" y="330" width="56" height="28" class="tile bad"/><text x="436" y="348.5" class="b" text-anchor="middle">failed</text><text x="490" y="340" class="s">Published: private MP3 + marks exist.</text><text x="490" y="359" class="s">Links expire after 15 minutes.</text><text x="20" y="399" class="xs mu">This status does not prove reader files were written or that a person listened.</text></svg>
