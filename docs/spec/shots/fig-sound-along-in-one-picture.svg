<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" role="img" aria-label="A passage becomes a word-linked reader. The passage text gives every word a number. A voice reads the text and each word gets a start time. The text and the timed words go through a check that every timed word lands on one passage word, and if not nothing is published. The student reader then lights each word as it is spoken, and a tap on a word replays from its start time. An optional heard-word check is off by default. A made-up sentence and made-up times."><style>
