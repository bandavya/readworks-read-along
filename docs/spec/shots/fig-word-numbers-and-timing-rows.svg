<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="The first four article words from the demo passage have data-i numbers zero through three. Each number selects the same numbered slot in a voice timing list, whose start and end are seconds. A punctuation-only token keeps its number but receives a null slot, and title words use a separate lead list. Time ranges shown are placeholders."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="440" class="bg"/><text x="20" y="27" class="era">The same number joins a visible word to a voice’s time</text><text x="20" y="63" class="b s">Article HTML, written by the publishing step</text><rect x="20" y="77" width="720" height="84" class="plate"/><text x="34" y="101" class="mono">data-i="0"</text><rect x="34" y="112" width="150" height="34" class="tile "/><text x="109" y="133.5" text-anchor="middle">The</text><path d="M109 146V205" class="li-l" marker-end="url(#a-li)"/><text x="204" y="101" class="mono">data-i="1"</text><rect x="204" y="112" width="150" height="34" class="tile "/><text x="279" y="133.5" text-anchor="middle">garden</text><path d="M279 146V205" class="li-l" marker-end="url(#a-li)"/><text x="374" y="101" class="mono">data-i="2"</text><rect x="374" y="112" width="150" height="34" class="tile "/><text x="449" y="133.5" text-anchor="middle">was</text><path d="M449 146V205" class="li-l" marker-end="url(#a-li)"/><text x="544" y="101" class="mono">data-i="3"</text><rect x="544" y="112" width="150" height="34" class="tile "/><text x="619" y="133.5" text-anchor="middle">small,</text><path d="M619 146V205" class="li-l" marker-end="url(#a-li)"/><text x="122" y="190" class="xs li">same number, same slot</text><rect x="20" y="209" width="720" height="106" class="plate"/><text x="34" y="231" class="b s">voices[0].t, written from word timing</text><rect x="34" y="244" width="150" height="34" class="sf"/><text x="42" y="265" class="mono">t[0]  [start, end]</text><rect x="204" y="244" width="150" height="34" class="sf"/><text x="212" y="265" class="mono">t[1]  [start, end]</text><rect x="374" y="244" width="150" height="34" class="sf"/><text x="382" y="265" class="mono">t[2]  [start, end]</text><rect x="544" y="244" width="150" height="34" class="sf"/><text x="552" y="265" class="mono">t[3]  [start, end]</text><text x="34" y="302" class="s mu">One slot per whitespace word, including silent punctuation. Times in seconds.</text><rect x="20" y="331" width="720" height="67" class="rev"/><text x="34" y="356" class="b s">A punctuation-only token keeps its number and gets t[i] = null.</text><text x="34" y="377" class="s">The browser skips that slot when seeking; title words use a separate lead list.</text><text x="20" y="426" class="xs mu">Joanna uses speech marks; live Ruth uses speech recognition. Rows shown are placeholders.</text></svg>
