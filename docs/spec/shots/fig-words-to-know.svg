<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" role="img" aria-label="Two marked appearances of a made-up word in a passage point to one entry in the Words to know list. The focused view sorts marked vocabulary senses alphabetically and shows written meaning, the word itself as the hear button, and optional Spanish and parts guide."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="336" class="bg"/><text x="20" y="25" class="xs mu">Example words are made up</text><rect x="20" y="42" width="340" height="176" class="plate"/><text x="34" y="67" class="b">In the passage</text><text x="34" y="100" class="print">The</text><rect x="76" y="78" width="72" height="29" class="lit"/><text x="80" y="100" class="print">summit</text><text x="156" y="100" class="print">was near.</text><text x="34" y="139" class="print">At the</text><rect x="96" y="118" width="72" height="29" class="lit"/><text x="100" y="140" class="print">summit</text><text x="176" y="140" class="print">we rested.</text><text x="34" y="191" class="s mu">Both marked spans use one vocabulary sense ID.</text><path d="M360 98H398V130H438" class="li-l" marker-end="url(#a-li)"/><path d="M360 160H398V130" class="li-l"/><text x="366" y="88" class="s li">one entry</text><rect x="442" y="42" width="298" height="176" class="plate"/><text x="456" y="67" class="b">Words to know</text><rect x="452" y="77" width="88" height="31" class="lit"/><text x="460" y="99" class="print">summit</text><text x="456" y="122" class="s">The top of a mountain.</text><text x="456" y="147" class="s li">Tap the word to hear it</text><text x="456" y="169" class="s mu">In Spanish, if supplied</text><text x="456" y="191" class="s mu">Parts guide, if available</text><rect x="20" y="238" width="720" height="62" class="sf"/><text x="34" y="262" class="s">Focused view: alphabetical list; each word is its hear button.</text><text x="34" y="284" class="s mu">The list does not include every unfamiliar word or measure what a child knows.</text><text x="20" y="324" class="xs mu">Source: MixReader.vue and passage vocab data model. Example sentence and meaning are made up.</text></svg>
