<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-label="In a local sandbox, a person labels flags on an invented sample and tries outcome rules. The model reports held mistakes, exposed mistakes, or unknown evidence. Owner and play choices do not change those outcomes. Structural failures take precedence. A simulated published result does not publish a take."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="352" class="bg"/><text x="20" y="27" class="era">Local policy sandbox · made-up sample, no audio</text><rect x="20" y="44" width="224" height="160" class="plate"/><text x="29" y="63" class="b s">Flags on sample takes</text><rect x="32" y="86" width="92" height="30" class="tile bad"/><text x="78" y="105.5" class="b" text-anchor="middle">dropped word</text><rect x="132" y="86" width="100" height="30" class="tile bad"/><text x="182" y="105.5" class="b" text-anchor="middle">extra speech</text><text x="32" y="148" class="s">Person labels each flag:</text><text x="32" y="164" class="s">voice mistake, recognizer</text><text x="32" y="180" class="s">mistake, or irrelevant</text><path d="M244 124H273" class="li-l" marker-end="url(#a-li)"/><text x="247" y="112" class="xs li">IDs</text><rect x="278" y="44" width="204" height="160" class="plate"/><text x="287" y="63" class="b s">Try outcome rules</text><text x="287" y="78" class="s mu">Which flags count?</text><text x="287" y="93" class="s mu">How much evidence?</text><text x="287" y="108" class="s mu">Hold, publish, or fail?</text><path d="M482 124H511" class="li-l" marker-end="url(#a-li)"/><text x="487" y="112" class="xs li">rule</text><rect x="516" y="44" width="224" height="160" class="plate"/><text x="525" y="63" class="b s">Modeled outcome</text><rect x="528" y="91" width="200" height="29" class="flag"/><text x="539" y="111" class="s">Held mistakes</text><rect x="528" y="126" width="200" height="29" class="sf"/><text x="539" y="146" class="s">Exposed mistakes</text><rect x="528" y="161" width="200" height="29" class="gone"/><text x="539" y="181" class="s">Unknown evidence</text><rect x="20" y="232" width="720" height="66" class="rev"/><text x="34" y="256" class="s">Structural failures take precedence over word rules.</text><text x="34" y="278" class="s">A simulated “published” result changes no reader file or publishing pipeline.</text><text x="20" y="318" class="xs mu">Owner and play choices are planning inputs; they do not change the modeled outcome.</text><text x="20" y="336" class="xs mu">Source: tools/holds-lab/policy.py and public sample.json; no real outcome counts are claimed.</text></svg>
