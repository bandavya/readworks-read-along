<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" role="img" aria-label="A held take shows the written word, what the recognizer heard, and the sentence around it. A reviewer plays the word or sentence, compares an older take if there is one, and marks sounds right or sounds wrong. After the last flag, if every answer is right, the panel offers clearing the hold or publishing. If not, it offers a new take or the older take when allowed, and a person can go ahead anyway with a second tap, sent as not approved. Every answer carries the take's fingerprint, so if the take changes pending answers are dropped. The panel is off by default, and no matching server is in this repository."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="392" class="bg"/><text x="20" y="24" class="era">One flagged spot at a time</text><rect x="20" y="38" width="226" height="186" class="flag"/><text x="29" y="57" class="b s">A held take</text><path d="M32.0 90.9V93.1M35.4 89.2V94.8M38.8 80.6V103.4M42.2 75.8V108.2M45.6 79.2V104.8M49.0 74.1V109.9M52.4 81.2V102.8M55.8 80.8V103.2M59.2 81.6V102.4M62.6 85.8V98.2M66.0 90.9V93.1M69.4 90.9V93.1M72.8 83.8V100.2M76.2 78.2V105.8M79.6 78.3V105.7M83.0 81.4V102.6M86.4 80.4V103.6M89.8 78.9V105.1M93.2 74.3V109.7M96.6 78.4V105.6M100.0 82.8V101.2M103.4 75.6V108.4M106.8 83.2V100.8M110.2 87.4V96.6M113.6 90.9V93.1M117.0 90.9V93.1M120.4 80.2V103.8M123.8 70.7V113.3M127.2 79.4V104.6M130.6 90.9V93.1M134.0 90.9V93.1M137.4 86.3V97.7M140.8 80.5V103.5M144.2 79.6V104.4M147.6 80.1V103.9M151.0 81.5V102.5M154.4 76.0V108.0M157.8 75.5V108.5M161.2 73.1V110.9M164.6 79.8V104.2M168.0 82.0V102.0M171.4 80.5V103.5M174.8 84.6V99.4M178.2 90.9V93.1M181.6 90.9V93.1M185.0 87.7V96.3M188.4 80.9V103.1M191.8 76.4V107.6M195.2 75.3V108.7M198.6 80.3V103.7M202.0 71.7V112.3M205.4 74.7V109.3M208.8 72.9V111.1M212.2 79.4V104.6M215.6 78.9V105.1M219.0 82.1V101.9M222.4 81.1V102.9M225.8 83.8V100.2M229.2 87.7V96.3M232.6 90.9V93.1" class="bars"/><rect x="68.36" y="66" width="46.46" height="52" class="am-l"/><text x="32" y="144" class="s mu">Page:</text><text x="72" y="144" class="b s">found</text><text x="32" y="162" class="s mu">Heard:</text><text x="72" y="162" class="b s">felt</text><text x="32" y="188" class="print">She found the old map.</text><text x="32" y="212" class="xs mu">The sentence around the word</text><path d="M246 130H276" class="am-l" marker-end="url(#a-am)"/><rect x="280" y="38" width="212" height="186" class="plate"/><text x="289" y="57" class="b s">A reviewer listens</text><g class="fmu"><circle cx="460" cy="48" r="6"/><path d="M449 69C449 56 471 56 471 69Z"/></g><text x="292" y="88" class="s">Play the word</text><text x="292" y="104" class="s">Play the sentence</text><text x="292" y="120" class="s">Compare an older take, if any</text><rect x="292" y="148" width="90" height="30" class="tile "/><text x="337" y="167.5" text-anchor="middle">Sounds right</text><rect x="390" y="148" width="90" height="30" class="tile "/><text x="435" y="167.5" text-anchor="middle">Sounds wrong</text><text x="292" y="204" class="s mu">and an optional note</text><path d="M492 130H522" class="am-l" marker-end="url(#a-am)"/><rect x="526" y="38" width="214" height="186" class="plate"/><text x="535" y="57" class="b s">After the last flag</text><text x="538" y="76" class="s mu">If every answer is right:</text><rect x="538" y="82" width="190" height="24" class="tile "/><text x="633" y="98.5" text-anchor="middle">Clear the hold, or publish</text><text x="538" y="126" class="s mu">If not, when allowed:</text><rect x="538" y="132" width="92" height="24" class="tile "/><text x="584" y="148.5" text-anchor="middle">New take</text><rect x="636" y="132" width="92" height="24" class="tile "/><text x="682" y="148.5" text-anchor="middle">Older take</text><text x="538" y="178" class="s mu">Or go ahead anyway: a second tap,</text><text x="538" y="193" class="s mu">sent as not approved.</text><rect x="20" y="244" width="720" height="62" class="sf"/><text x="34" y="268" class="b">Every answer carries the take's fingerprint</text><text x="34" y="288" class="s">If the take changes, pending answers are dropped instead of landing on the wrong audio.</text><rect x="20" y="318" width="352" height="62" class="rev"/><text x="34" y="342" class="b">Seeing a flag is not approving it</text><text x="34" y="362" class="s">Leaving a word unanswered never counts as a yes.</text><rect x="388" y="318" width="352" height="62" class="sf"/><text x="402" y="342" class="b">Built, and off by default</text><text x="402" y="360" class="s">A decision becomes a request to a server,</text><text x="402" y="375" class="s">and no matching server is in this repository.</text></svg>
