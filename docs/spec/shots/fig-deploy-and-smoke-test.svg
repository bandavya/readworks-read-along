<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" role="img" aria-label="A teammate builds and deploys the stack, publishes the reader site, and runs a smoke script that uploads one passage. The script waits for audio and reader publication, fetches the reader files and MP3 through the website, and checks byte ranges, MP3 frames and word timing. The team reports deployment, upload, generation, and timing on event AWS, but not a pass of this exact smoke command."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="396" class="bg"/><text x="20" y="27" class="era">Procedure to run in one AWS account and region</text><rect x="20" y="50" width="200" height="84" class="plate"/><text x="30" y="71" class="b s">1  Build and deploy</text><text x="30" y="90" class="mono">cdk deploy → outputs.json</text><text x="30" y="108" class="xs mu">The stack and its settings</text><path d="M220 92H280" class="li-l" marker-end="url(#a-li)"/><text x="250" y="72" class="xs li" text-anchor="middle">bucket</text><text x="250" y="85" class="xs li" text-anchor="middle">names</text><rect x="280" y="50" width="200" height="84" class="plate"/><text x="290" y="71" class="b s">2  Publish the reader site</text><text x="290" y="90" class="mono">publish-frontend.js</text><text x="290" y="108" class="xs mu">To the frontend bucket</text><path d="M480 92H540" class="li-l" marker-end="url(#a-li)"/><text x="510" y="72" class="xs li" text-anchor="middle">then</text><text x="510" y="85" class="xs li" text-anchor="middle"></text><rect x="540" y="50" width="200" height="84" class="plate"/><text x="550" y="71" class="b s">3  Upload a passage</text><text x="550" y="90" class="mono">smoke.js</text><text x="550" y="108" class="xs mu">One unique passage file</text><path d="M640 134V176" class="li-l" marker-end="url(#a-li)"/><text x="650" y="158" class="xs li">passage file</text><rect x="540" y="180" width="200" height="84" class="plate"/><text x="550" y="201" class="b s">4  The workflow runs</text><text x="550" y="220" class="xs mu">S3 arrival starts it. The</text><text x="550" y="235" class="xs mu">script waits for the run and</text><text x="550" y="250" class="xs mu">a reader-ready result.</text><path d="M540 222H480" class="li-l" marker-end="url(#a-li)"/><text x="510" y="202" class="xs li" text-anchor="middle">published</text><text x="510" y="215" class="xs li" text-anchor="middle">files</text><rect x="280" y="180" width="200" height="84" class="plate"/><text x="290" y="201" class="b s">5  Fetch through the site</text><text x="290" y="220" class="xs mu">Reader index, passage</text><text x="290" y="235" class="xs mu">record and MP3</text><path d="M280 222H220" class="li-l" marker-end="url(#a-li)"/><text x="250" y="202" class="xs li" text-anchor="middle">MP3 +</text><text x="250" y="215" class="xs li" text-anchor="middle">data</text><rect x="20" y="180" width="200" height="84" class="pivot"/><text x="30" y="201" class="b s">6  Check what arrived</text><text x="30" y="220" class="xs mu">Byte ranges, MP3 frames,</text><text x="30" y="235" class="xs mu">word rows, and timing</text><text x="30" y="250" class="xs mu">against audio length</text><rect x="20" y="290" width="720" height="66" class="rev"/><text x="34" y="315" class="s">The team reports CDK deployment, upload, generation, and timing on event AWS.</text><text x="34" y="335" class="s">This exact smoke command was not reported as passed; sound was not heard.</text><text x="20" y="380" class="xs mu">Use the same explicit --region for publishing and smoke. --clean removes only the uploaded source file.</text></svg>
