<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 572" role="img" aria-label="A table of the fields in the manifest file and the job table row for one generated take. Both records hold the passage ID, text hash, status, review status, audio key and speech marks key. Only the manifest holds the audio ID, provider and type; only the job row holds the character count and the update and reader-published times. The checked path says generated and needs human check, which does not mean a person listened. Placeholder values are labeled."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="572" class="bg"/><text x="20" y="27" class="era">Two records for one generated take</text><text x="20" y="50" class="s li">Live Ruth path: heard-word check on; default Joanna path: off</text><text x="606" y="70" class="b s" text-anchor="middle">Manifest</text><text x="606" y="86" class="xs mu" text-anchor="middle">a file</text><text x="698" y="70" class="b s" text-anchor="middle">Job row</text><text x="698" y="86" class="xs mu" text-anchor="middle">a table entry</text><text x="20" y="86" class="b s">Field</text><text x="170" y="86" class="b s">Value in the demo</text><path d="M20 96H740" class="ln"/><rect x="20" y="102" width="720" height="22" class="sf"/><text x="28" y="118" class="mono">passageId</text><text x="170" y="118" class="mono">demo-passage-001</text><circle cx="606" cy="113" r="5" class="fli"/><circle cx="698" cy="113" r="5" class="fli"/><text x="28" y="140" class="mono">textHash</text><text x="170" y="140" class="mono">sha256:&lt;digest></text><circle cx="606" cy="135" r="5" class="fli"/><circle cx="698" cy="135" r="5" class="fli"/><rect x="20" y="146" width="720" height="22" class="sf"/><text x="28" y="162" class="mono">status</text><text x="170" y="162" class="mono">generated</text><circle cx="606" cy="157" r="5" class="fli"/><circle cx="698" cy="157" r="5" class="fli"/><text x="28" y="184" class="mono">reviewStatus</text><text x="170" y="184" class="mono">needs human check</text><circle cx="606" cy="179" r="5" class="fli"/><circle cx="698" cy="179" r="5" class="fli"/><rect x="20" y="190" width="720" height="22" class="sf"/><text x="28" y="206" class="mono">audioKey</text><text x="170" y="206" class="mono">audio/&lt;audioId>.mp3</text><circle cx="606" cy="201" r="5" class="fli"/><circle cx="698" cy="201" r="5" class="fli"/><text x="28" y="228" class="mono">speechMarksKey</text><text x="170" y="228" class="mono">audio/&lt;audioId>.speechmarks.json</text><circle cx="606" cy="223" r="5" class="fli"/><circle cx="698" cy="223" r="5" class="fli"/><rect x="20" y="234" width="720" height="22" class="sf"/><text x="28" y="250" class="mono">audioId</text><text x="170" y="250" class="mono">A_Very_Small_Garden_v1_...</text><circle cx="606" cy="245" r="5" class="fli"/><text x="28" y="272" class="mono">audioProvider</text><text x="170" y="272" class="mono">amazon-polly</text><circle cx="606" cy="267" r="5" class="fli"/><rect x="20" y="278" width="720" height="22" class="sf"/><text x="28" y="294" class="mono">audioType</text><text x="170" y="294" class="mono">synthetic</text><circle cx="606" cy="289" r="5" class="fli"/><text x="28" y="316" class="mono">charCount</text><text x="170" y="316" class="mono">normalized text length</text><circle cx="698" cy="311" r="5" class="fli"/><rect x="20" y="322" width="720" height="22" class="sf"/><text x="28" y="338" class="mono">updatedAt</text><text x="170" y="338" class="mono">&lt;time></text><circle cx="698" cy="333" r="5" class="fli"/><text x="28" y="360" class="mono">readerPublishedAt</text><text x="170" y="360" class="mono">&lt;time, once ready></text><circle cx="698" cy="355" r="5" class="fli"/><path d="M560 96V368" class="ln"/><text x="20" y="390" class="s">Both records name the same passage and the same audio files.</text><rect x="20" y="404" width="346" height="50" class="plate"/><text x="30" y="423" class="b s">manifests/&lt;id>.json in the content store</text><text x="30" y="441" class="xs mu">Written by the workflow or check; read by status lookup.</text><rect x="394" y="404" width="346" height="50" class="plate"/><text x="404" y="423" class="b s">Job table, keyed by passageId + textHash</text><text x="404" y="441" class="xs mu">Written by the workflow, check and publishing; read by status.</text><rect x="20" y="470" width="720" height="64" class="rev"/><text x="34" y="494" class="b s">"generated" + "needs human check" means automated work finished.</text><text x="34" y="516" class="s">It does not mean a person listened. A hold records reviewKey and holdReasons in the job row.</text><text x="20" y="560" class="xs mu">Example keys follow the demo title and ID; digest and times are placeholders. A dot means the record has the field.</text></svg>
