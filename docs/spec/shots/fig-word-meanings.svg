<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" role="img" aria-label="A made-up passage word opens a meaning card after a half-second hold. In the focused reader only marked vocabulary words open a card, with no spoken meaning or usage count. The classic and younger readers may help with any narrated word, choosing a contextual gloss, ReadWorks definition or syllable guide, or replaying the story word if there is no help."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="428" class="bg"/><text x="20" y="25" class="xs mu">A made-up word in a passage</text><rect x="20" y="40" width="330" height="76" class="plate"/><text x="34" y="72" class="print">The hiker reached the</text><rect x="222" y="50" width="82" height="28" class="lit"/><text x="228" y="72" class="print">summit.</text><text x="34" y="103" class="s mu">Marked vocabulary word: summit</text><path d="M350 64H446" class="li-l" marker-end="url(#a-li)"/><text x="398" y="54" class="s li" text-anchor="middle">hold 500 ms</text><rect x="450" y="40" width="290" height="132" class="plate"/><text x="464" y="64" class="b">Focused reader: Meaning</text><text x="464" y="91" class="print">summit</text><text x="464" y="114" class="s">The top of a mountain.</text><text x="464" y="140" class="s mu">Syllable guide, if available</text><text x="464" y="159" class="s mu">No spoken meaning; no usage count</text><path d="M180 116V212" class="li-l" marker-end="url(#a-li)"/><text x="190" y="170" class="s li">classic or younger reader</text><rect x="20" y="216" width="720" height="112" class="plate"/><text x="34" y="241" class="b">Any narrated word held</text><text x="34" y="263" class="s">Contextual gloss → ReadWorks definition → syllable guide</text><text x="34" y="285" class="s">If none applies, replay that word from the story.</text><text x="34" y="309" class="s mu">A card can speak help audio; opening it records a count, without the word.</text><rect x="20" y="345" width="720" height="48" class="rev"/><text x="34" y="365" class="s">Generated text, spoken definitions and syllable clips need human review.</text><text x="34" y="382" class="s">The focused reader shows no draft label.</text><text x="20" y="417" class="xs mu">Example sentence and meaning are made up. Behavior: MixReader.vue, useWordHelp.js, defs.js.</text></svg>
