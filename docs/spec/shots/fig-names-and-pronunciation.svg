<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 397" role="img" aria-label="The committed names list has no entries. The AWS quality gate reads the heard_as field for alternate recognizer spellings. A confirmed IPA pronunciation could guide local recorder narration and needs a person to listen. The AWS narration path does not apply the pronunciation field. No listening check is recorded."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="397" class="bg"/><text x="20" y="27" class="era">Two separate meanings of a name entry</text><rect x="20" y="49" width="198" height="175" class="gone"/><text x="29" y="68" class="b s">names.json</text><text x="29" y="83" class="s mu">Committed lists are empty.</text><text x="29" y="98" class="s mu">No confirmed entry exists.</text><rect x="34" y="145" width="170" height="32" class="tile hole"/><text x="119" y="165.5" text-anchor="middle">A passage name</text><path d="M218 108H263" class="li-l" marker-end="url(#a-li)"/><text x="225" y="92" class="xs li">heard_as</text><rect x="268" y="49" width="215" height="175" class="plate"/><text x="277" y="68" class="b s">Word comparison</text><text x="277" y="83" class="s mu">Alternate recognizer spelling</text><text x="277" y="98" class="s mu">can count as the same name.</text><text x="277" y="113" class="s mu">This says nothing about sound.</text><path d="M218 188V255H263" class="li-d" marker-end="url(#a-li)"/><text x="228" y="246" class="xs li">pronounce_ipa: idea for a confirmed entry</text><rect x="268" y="261" width="215" height="91" class="dash"/><text x="277" y="280" class="b s">Local recorder narration</text><text x="277" y="295" class="s mu">Can use confirmed IPA as a</text><text x="277" y="310" class="s mu">spoken phoneme.</text><path d="M483 305H529" class="am-l" marker-end="url(#a-am)"/><text x="486" y="290" class="xs am">listen</text><rect x="534" y="261" width="206" height="91" class="flag"/><text x="543" y="280" class="b s">Person confirms by ear</text><text x="543" y="295" class="s mu">No listening check</text><text x="543" y="310" class="s mu">has been recorded.</text><rect x="520" y="49" width="220" height="175" class="sf"/><text x="534" y="74" class="s">AWS quality gate reads</text><text x="534" y="98" class="s">heard_as spellings.</text><text x="534" y="122" class="s">AWS narration ignores</text><text x="534" y="146" class="s">pronounce_ipa in this list.</text><text x="534" y="170" class="s">Sound is not confirmed.</text><text x="20" y="382" class="xs mu">Idea, not built: ask ReadWorks or a trusted person which pronunciation is intended.</text></svg>
