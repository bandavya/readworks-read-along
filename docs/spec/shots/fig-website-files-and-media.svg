<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-label="This checkout has frontend/index.html, assets, and experiments.json. The website publisher uploads those to the website store, where the publishing step also writes passage JSON, the library index, and copied audio. Separate content and audio stores hold source passages, manifests, generated MP3s, and speech marks. No frontend data, audio, or image seed directories are present in this checkout."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="435" class="bg"/><text x="20" y="27" class="era">What is in this checkout, and what the pipeline stores</text><rect x="20" y="45" width="328" height="177" class="plate"/><text x="34" y="69" class="b">Repo: frontend/</text><text x="34" y="98" class="mono">index.html</text><text x="34" y="123" class="mono">assets/*</text><text x="34" y="148" class="mono">experiments.json</text><text x="34" y="192" class="s am">No data/, audio/, or img/ seed here</text><text x="34" y="211" class="xs mu">Build script replaces shell files</text><path d="M348 124H406" class="li-l" marker-end="url(#a-li)"/><text x="377" y="111" class="xs li" text-anchor="middle">publisher</text><rect x="410" y="45" width="330" height="177" class="plate"/><text x="424" y="69" class="b">Website store: browser copies</text><text x="424" y="98" class="mono">index.html, assets/*, experiments.json</text><text x="424" y="123" class="mono">data/&lt;id>.json, data/index.json</text><text x="424" y="148" class="mono">audio/&lt;id>/&lt;digest>.mp3</text><text x="424" y="173" class="mono">data/syllables/*, audio/syl/* (Ruth)</text><text x="424" y="192" class="s">Bridge writes data and copied audio</text><text x="424" y="211" class="xs mu">Browser reads relative paths</text><rect x="20" y="268" width="328" height="118" class="sf"/><text x="34" y="293" class="b s">Content store: pipeline source and receipt</text><text x="34" y="318" class="mono">passages/&lt;id>.json</text><text x="34" y="341" class="mono">manifests/&lt;id>.json, content/&lt;id>.json</text><text x="34" y="371" class="xs mu">The audio step and publishing step read source</text><rect x="410" y="268" width="330" height="118" class="sf"/><text x="424" y="293" class="b s">Audio store: working media</text><text x="424" y="318" class="mono">audio/*.mp3</text><text x="424" y="341" class="mono">audio/*.speechmarks.json</text><text x="424" y="371" class="xs mu">Publishing step copies MP3 into website store</text><path d="M575 268V226" class="li-l" marker-end="url(#a-li)"/><text x="583" y="254" class="xs li">copied MP3</text><path d="M348 354H380V190H406" class="li-l" marker-end="url(#a-li)"/><text x="388" y="252" class="xs li">source</text><text x="20" y="421" class="xs mu">The website publisher uploads files under frontend/; only data/index.json gets a live-row merge.</text></svg>
