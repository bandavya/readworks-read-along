<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" role="img" aria-label="The MP3, word start marks and passage text come in once the audio checks pass. Each mark is checked against the passage. If they fit, three things are written in order: the sound, the passage record with timing, and the library list, and the reader labels the voice as needing a human check. On the Ruth deployment, word guide audio follows, and a failure there does not stop the passage. If they do not fit, a publication failure is recorded and a later run can reuse the audio to retry."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="338" class="bg"/><text x="20" y="24" class="era">After the audio checks pass</text><rect x="20" y="38" width="150" height="150" class="plate"/><text x="29" y="57" class="b s">What comes in</text><path d="M32.0 83.2V84.8M35.4 80.7V87.3M38.8 74.1V93.9M42.2 71.8V96.2M45.6 75.9V92.1M49.0 76.0V92.0M52.4 83.2V84.8M55.8 82.6V85.4M59.2 78.9V89.1M62.6 76.1V91.9M66.0 74.9V93.1M69.4 72.5V95.5M72.8 71.4V96.6M76.2 75.3V92.7M79.6 79.9V88.1M83.0 83.2V84.8M86.4 79.7V88.3M89.8 75.9V92.1M93.2 83.2V84.8M96.6 80.7V87.3M100.0 78.0V90.0M103.4 78.3V89.7M106.8 70.9V97.1M110.2 75.2V92.8M113.6 77.5V90.5M117.0 76.5V91.5M120.4 77.2V90.8M123.8 83.2V84.8M127.2 80.3V87.7M130.6 78.7V89.3M134.0 74.5V93.5M137.4 74.6V93.4M140.8 75.6V92.4M144.2 77.3V90.7M147.6 75.0V93.0M151.0 76.5V91.5M154.4 78.6V89.4M157.8 83.2V84.8" class="bars"/><text x="32" y="112" class="s">The MP3</text><g><path d="M32 124v10" class="li-l"/><path d="M52.8 124v10" class="li-l"/><path d="M81.6 124v10" class="li-l"/><path d="M91.2 124v10" class="li-l"/><path d="M120 124v10" class="li-l"/></g><text x="32" y="150" class="s">Word start marks</text><text x="32" y="176" class="s">The passage text</text><path d="M170 112H200" class="li-l" marker-end="url(#a-li)"/><rect x="204" y="58" width="150" height="110" class="pivot"/><text x="216" y="84" class="b">Does every mark</text><text x="216" y="101" class="b">fit the passage?</text><text x="216" y="128" class="s mu">Positions, spellings,</text><text x="216" y="143" class="s mu">order and coverage</text><path d="M354 112H392" class="li-l" marker-end="url(#a-li)"/><text x="373" y="104" class="li s" text-anchor="middle">yes</text><text x="398" y="40" class="b s">Written in this order</text><path d="M412 72V170" class="ln"/><circle cx="412" cy="68" r="13" class="fli"/><text x="412" y="73" text-anchor="middle" class="b" style="fill:var(--bg)">1</text><text x="434" y="66" class="b">The sound</text><text x="434" y="83" class="mono">audio/&lt;id>/&lt;digest>.mp3</text><circle cx="412" cy="118" r="13" class="fli"/><text x="412" y="123" text-anchor="middle" class="b" style="fill:var(--bg)">2</text><text x="434" y="116" class="b">The passage record</text><text x="434" y="133" class="mono">data/&lt;id>.json, with timing</text><circle cx="412" cy="168" r="13" class="fli"/><text x="412" y="173" text-anchor="middle" class="b" style="fill:var(--bg)">3</text><text x="434" y="166" class="b">The library list</text><text x="434" y="183" class="mono">data/index.json</text><path d="M612 118H636" class="li-l" marker-end="url(#a-li)"/><rect x="640" y="60" width="100" height="118" class="plate"/><text x="650" y="80" class="b s">The reader</text><rect x="650.0" y="92" width="8.0" height="6" class="fline"/><rect x="662.0" y="92" width="13.5" height="6" class="fline"/><rect x="679.5" y="92" width="11.7" height="6" class="fline"/><rect x="695.3" y="92" width="13.3" height="6" class="fline"/><rect x="712.5" y="92" width="16.4" height="6" class="fline"/><rect x="650.0" y="104" width="17.2" height="6" class="fline"/><rect x="671.2" y="104" width="10.0" height="6" class="lit"/><rect x="685.2" y="104" width="8.5" height="6" class="fline"/><rect x="697.7" y="104" width="8.5" height="6" class="fline"/><rect x="710.2" y="104" width="19.3" height="6" class="fline"/><rect x="650.0" y="116" width="10.1" height="6" class="fline"/><rect x="664.1" y="116" width="15.8" height="6" class="fline"/><rect x="683.9" y="116" width="14.9" height="6" class="fline"/><rect x="702.8" y="116" width="9.5" height="6" class="fline"/><rect x="716.3" y="116" width="10.2" height="6" class="fline"/><rect x="650.0" y="128" width="16.2" height="6" class="fline"/><rect x="670.2" y="128" width="8.2" height="6" class="fline"/><rect x="682.4" y="128" width="8.3" height="6" class="fline"/><rect x="694.8" y="128" width="10.1" height="6" class="fline"/><rect x="708.9" y="128" width="10.8" height="6" class="fline"/><rect x="723.7" y="128" width="6.3" height="6" class="fline"/><text x="650" y="156" class="xs am">needs human</text><text x="650" y="169" class="xs am">check</text><path d="M279 168V222" class="am-l" marker-end="url(#a-am)"/><text x="288" y="200" class="am s">no</text><path d="M412 182V224" class="am-l" marker-end="url(#a-am)"/><text x="420" y="208" class="s am">a write fails</text><rect x="204" y="226" width="240" height="74" class="flag"/><text x="213" y="245" class="b s">Publication failure recorded</text><text x="213" y="260" class="s mu">The job stops here. A later run can</text><text x="213" y="275" class="s mu">reuse the same audio to try again.</text><rect x="464" y="226" width="276" height="74" class="dash"/><text x="476" y="248" class="b s">Then, on the Ruth deployment</text><text x="476" y="266" class="s">Word guide audio in the same voice.</text><text x="476" y="281" class="s">If it fails, the passage still publishes.</text><text x="20" y="326" class="s mu">Publishing means the reader has files and timing it can use. It does not mean a person heard the narration.</text></svg>
