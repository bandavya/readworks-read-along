<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="The same spoken word, found, appears in three follow-along choices. The default highlights just the word. Underline leaves the words uncolored. Sentence tints the entire sentence and underlines found. Changing the choice does not move playback. The sample sentence is made up."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="350" class="bg"/><text x="20" y="28" class="era">One spoken word: “found”</text><text x="20" y="56" class="s mu">The recording and word timing stay in place when the reader changes the cue.</text><rect x="20" y="76" width="720" height="74" class="plate"/><text x="34" y="103" class="b">Highlight the word</text><text x="34" y="124" class="s mu">Default</text><text x="245" y="115" class="print">The</text><text x="300" y="115" class="print">small</text><text x="365" y="115" class="print">bird</text><rect x="415" y="92" width="61" height="30" class="lit"/><text x="418" y="115" class="print">found</text><text x="482" y="115" class="print">a</text><text x="503" y="115" class="print">seed.</text><rect x="20" y="158" width="720" height="74" class="plate"/><text x="34" y="185" class="b">Underline the word</text><text x="34" y="206" class="s mu">Text stays uncolored</text><text x="245" y="197" class="print">The</text><text x="300" y="197" class="print">small</text><text x="365" y="197" class="print">bird</text><text x="418" y="197" class="print">found</text><text x="482" y="197" class="print">a</text><text x="503" y="197" class="print">seed.</text><path d="M418 205h53" class="li-l"/><rect x="20" y="240" width="720" height="74" class="plate"/><text x="34" y="267" class="b">Highlight the sentence</text><text x="34" y="288" class="s mu">The spoken word is underlined</text><rect x="236" y="255" width="334" height="34" class="lit"/><text x="245" y="279" class="print">The</text><text x="300" y="279" class="print">small</text><text x="365" y="279" class="print">bird</text><text x="418" y="279" class="print">found</text><text x="482" y="279" class="print">a</text><text x="503" y="279" class="print">seed.</text><path d="M418 287h53" class="li-l"/><text x="20" y="339" class="xs mu">A made-up sentence. Sentence edges are inferred from punctuation and text blocks.</text></svg>
