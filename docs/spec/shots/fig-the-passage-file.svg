<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="A source JSON file for demo-passage-001 contains the passage ID, title, text, language, grade band, lexile, word count, vocabulary, questions, and Sound Along settings. The audio step reads it for speech and timing; the publishing step reads it again for numbered article HTML and vocabulary, and recounts the words."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="360" class="bg"/><text x="20" y="28" class="era">One written source for one passage</text><rect x="20" y="44" width="370" height="270" class="plate"/><rect x="26" y="189" width="358" height="22" class="rev"/><text x="34" y="68" class="b mono">passages/demo-passage-001.json</text><text x="34" y="100" class="mono">passageId  demo-passage-001</text><text x="34" y="121" class="mono">title      A Very Small Garden</text><text x="34" y="142" class="mono">text       The garden was small, but ...</text><text x="34" y="163" class="mono">language   en-US</text><text x="34" y="184" class="mono">gradeBand  2-3          lexile  430</text><text x="34" y="205" class="mono">wordCount  52</text><text x="34" y="226" class="mono">vocabulary color → the quality seen ...</text><text x="34" y="247" class="mono">questions  q1, q2</text><text x="34" y="268" class="mono">soundAlong enabled: true</text><text x="150" y="205" class="xs am">← text really has 46</text><text x="34" y="298" class="xs mu">Written by a content author or intake service</text><path d="M390 138H426" class="li-l" marker-end="url(#a-li)"/><path d="M390 226H426" class="li-l" marker-end="url(#a-li)"/><rect x="430" y="78" width="310" height="114" class="plate"/><text x="444" y="103" class="b">Audio step reads text + settings</text><text x="444" y="128" class="s">Speech from text</text><text x="444" y="147" class="s">Hash: text + voice + engine + language</text><text x="444" y="166" class="s">Word marks for timing</text><rect x="430" y="205" width="310" height="109" class="plate"/><text x="444" y="230" class="b">Publishing step reads source again</text><text x="444" y="255" class="s">Recounts words; makes numbered HTML</text><text x="444" y="274" class="s">Copies vocabulary; checks formatted text</text><text x="444" y="293" class="s">Does not copy questions</text><text x="20" y="343" class="xs am">Source says wordCount 52; text has 46 whitespace words. The publishing step uses 46.</text></svg>
