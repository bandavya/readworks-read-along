<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 468" role="img" aria-label="A made-up two-part word guide shows that tapping a part plays its recorded clip. Hear it uses a whole-word recording and lights each part by an estimate from letter counts. Slowly plays a prepared slow recording, lighting each part and then the whole word. On the Ruth deployment these new clips use the passage voice; the default Joanna deployment uses older clips. A one-part word plays the whole clip at 0.6 times speed with no separate slow clip or lit parts."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="468" class="bg"/><text x="20" y="26" class="xs mu">A made-up word and parts; no times implied</text><text x="20" y="62" class="b s">Guide</text><rect x="132" y="40" width="95" height="44" class="tile "/><text x="179.5" y="66.5" text-anchor="middle">sum</text><text x="237" y="69" class="b">·</text><rect x="256" y="40" width="95" height="44" class="tile "/><text x="303.5" y="66.5" text-anchor="middle">mit</text><circle cx="139" cy="49" r="4" class="fam"/><circle cx="390" cy="62" r="4" class="fam"/><text x="402" y="67" class="s mu">Strong beat is marked on the part button.</text><text x="20" y="134" class="b s">Tap a part</text><rect x="132" y="106" width="95" height="44" class="tile "/><text x="179.5" y="132.5" text-anchor="middle">sum</text><text x="239" y="134" class="s li">→ recorded clip for that part</text><text x="20" y="209" class="b s">Hear it</text><rect x="132" y="171" width="608" height="53" class="sf"/><rect x="142" y="180" width="260" height="34" class="lit"/><text x="150" y="203" class="s">sum lights</text><text x="452" y="203" class="s">mit lights</text><text x="20" y="284" class="b s">Slowly</text><rect x="132" y="246" width="608" height="57" class="sf"/><rect x="142" y="255" width="182" height="38" class="lit"/><text x="150" y="279" class="s">sum</text><text x="341" y="279" class="s">mit</text><text x="552" y="279" class="s">whole word</text><text x="132" y="326" class="s mu">Both buttons use prepared recordings; story narration pauses.</text><rect x="20" y="346" width="720" height="63" class="sf"/><text x="34" y="366" class="s">One-part word: Slowly plays the whole clip at 0.6x.</text><text x="34" y="385" class="s mu">No separate slow clip or lit parts for that playback.</text><text x="20" y="431" class="s">Team reports: on Ruth, new clips use the passage voice; default Joanna uses older clips.</text><text x="20" y="451" class="s mu">A person still needs to check pronunciation and pacing.</text></svg>
