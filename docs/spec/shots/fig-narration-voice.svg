<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 342" role="img" aria-label="The default Joanna neural voice sends the same cleaned text in separate MP3 and speech-mark requests. The workflow polls for both tasks, checks the outputs, and gives the reader a timed voice."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
