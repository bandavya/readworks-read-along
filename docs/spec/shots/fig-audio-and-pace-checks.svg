<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="The MP3 and word starts are checked together. Tiny or unreadable audio, no marks, or a last start more than half a second beyond the audio stop the run. A long gap or pace outside 90 to 200 words per minute is kept as a warning."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
