<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" role="img" aria-label="A made-up six-student dashboard shows all six class totals and columns: Opened, Audio played, Tapped a word, Replayed, Used word help, and Audio would not play. Student D is marked not opened here. Audio levels include Significant part. The link does not verify student identity."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="576" class="bg"/><text x="20" y="25" class="b am">Made-up class from the built demo route</text><rect x="20" y="40" width="720" height="116" class="sf"/><text x="34" y="62" class="b s">Class totals: students with each signal</text><text x="34" y="88" class="s">Opened</text><text x="194" y="88" class="b s">5 of 6</text><text x="266" y="88" class="s">Audio played</text><text x="426" y="88" class="b s">3 of 6</text><text x="498" y="88" class="s">Tapped a word</text><text x="658" y="88" class="b s">2 of 6</text><text x="34" y="133" class="s">Replayed</text><text x="194" y="133" class="b s">1 of 6</text><text x="266" y="133" class="s">Used word help</text><text x="426" y="133" class="b s">2 of 6</text><text x="498" y="133" class="s">Audio wouldn't play</text><text x="658" y="133" class="b s">1 of 6</text><rect x="20" y="174" width="720" height="289" class="plate"/><rect x="20" y="174" width="720" height="58" class="sf"/><text x="32" y="196" class="b xs">Student</text><text x="148" y="196" class="b xs">Opened</text><text x="240" y="196" class="b xs">Audio</text><text x="240" y="214" class="b xs">played</text><text x="335" y="196" class="b xs">Tapped a</text><text x="335" y="214" class="b xs">word</text><text x="432" y="196" class="b xs">Replayed</text><text x="520" y="196" class="b xs">Used word</text><text x="520" y="214" class="b xs">help</text><text x="628" y="196" class="b xs">Audio wouldn't</text><text x="628" y="214" class="b xs">play</text><text x="32" y="255" class="s b">Student A</text><text x="148" y="255" class="xs">Yes</text><text x="240" y="255" class="xs">Nearly all</text><text x="520" y="255" class="xs">Yes</text><path d="M32 274H726" class="ln"/><text x="32" y="289" class="s b">Student B</text><text x="148" y="289" class="xs">Yes</text><text x="240" y="289" class="xs">Partway</text><text x="335" y="289" class="xs">Yes</text><text x="432" y="289" class="xs">Yes</text><text x="520" y="289" class="xs">Yes</text><path d="M32 308H726" class="ln"/><text x="32" y="323" class="s b">Student C</text><text x="148" y="323" class="xs">Yes</text><text x="628" y="323" class="xs">Yes</text><path d="M32 342H726" class="ln"/><text x="32" y="357" class="s b">Student D</text><text x="32" y="372" class="xs mu">not opened here</text><path d="M32 376H726" class="ln"/><text x="32" y="391" class="s b">Student E</text><text x="148" y="391" class="xs">Yes</text><path d="M32 410H726" class="ln"/><text x="32" y="425" class="s b">Student F</text><text x="148" y="425" class="xs">Yes</text><text x="240" y="425" class="xs">Significant</text><text x="240" y="438" class="xs">part</text><text x="335" y="425" class="xs">Yes</text><rect x="20" y="481" width="720" height="61" class="rev"/><text x="34" y="504" class="s">Not opened here means only no activity was recorded here.</text><text x="34" y="525" class="s mu">The link does not verify which student chose the name.</text><text x="20" y="563" class="xs mu">Source: TeacherClass.vue demo rows, TeacherDashboard.vue and options.js. Counts are made up.</text></svg>
