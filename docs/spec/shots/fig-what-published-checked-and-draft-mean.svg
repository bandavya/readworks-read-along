<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 454" role="img" aria-label="Narration audio and word times pass a machine check. The default Joanna path is labeled approved and unreviewed; the live Ruth setup has the optional heard-word check and is labeled generated and needs human check. Both can publish to the reader, while a held take cannot. Separately, word help moves from draft to checked on one browser to approved in a data file, and a text or audio change returns it to draft."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="454" class="bg"/><text x="20" y="26" class="era">Two kinds of status answer two different questions</text><text x="20" y="58" class="b">Narration: can a student open it?</text><rect x="20" y="72" width="120" height="72" class="plate"/><text x="32" y="98" class="s">Audio +</text><text x="32" y="116" class="s">word times</text><path d="M140 108H168" class="li-l" marker-end="url(#a-li)"/><rect x="172" y="72" width="120" height="72" class="plate"/><text x="184" y="94" class="b s">Machine check</text><text x="184" y="112" class="s">word mapping</text><text x="184" y="129" class="s">passes</text><path d="M292 92H414" class="li-l" marker-end="url(#a-li)"/><text x="353" y="84" class="xs li" text-anchor="middle">Joanna default</text><rect x="418" y="65" width="170" height="55" class="sf"/><text x="430" y="87" class="b s">approved + unreviewed</text><text x="430" y="105" class="xs mu">Machine pass only</text><path d="M292 125H312V155H414" class="li-d" marker-end="url(#a-li)"/><text x="363" y="148" class="xs li" text-anchor="middle">word check on</text><rect x="418" y="128" width="170" height="55" class="dash"/><text x="430" y="150" class="b s">generated + needs</text><text x="430" y="167" class="b s">human check</text><path d="M588 92H606V114H626" class="li-l" marker-end="url(#a-li)"/><path d="M588 156H606V132H626" class="li-d" marker-end="url(#a-li)"/><rect x="630" y="94" width="110" height="56" class="plate"/><text x="642" y="118" class="b s">Published:</text><text x="642" y="136" class="s">in reader library</text><path d="M312 155V226H414" class="am-l" marker-end="url(#a-am)"/><text x="322" y="220" class="xs am">words differ</text><rect x="418" y="202" width="322" height="48" class="flag"/><text x="430" y="223" class="b s">Held: no new reader copy</text><text x="430" y="241" class="s">Heard words differ, or the check fails.</text><path d="M20 266H740" class="ln"/><text x="20" y="298" class="b">Word help: has a person checked this exact text and clip?</text><rect x="20" y="315" width="228" height="65" class="plate"/><text x="32" y="339" class="b">Draft</text><text x="32" y="362" class="s mu">Unchecked</text><rect x="266" y="315" width="228" height="65" class="plate"/><text x="278" y="339" class="b">Checked</text><text x="278" y="362" class="s mu">One browser</text><rect x="512" y="315" width="228" height="65" class="plate"/><text x="524" y="339" class="b">Approved</text><text x="524" y="362" class="s mu">Applied to data file</text><path d="M248 347H262" class="li-l" marker-end="url(#a-li)"/><path d="M494 347H508" class="li-l" marker-end="url(#a-li)"/><path d="M626 380V412H134V382" class="am-l" marker-end="url(#a-am)"/><text x="380" y="405" class="s am" text-anchor="middle">A text or audio change returns the item to draft.</text><text x="20" y="442" class="xs mu">Published narration can still be unreviewed. New Ruth guide clips need human review.</text></svg>
