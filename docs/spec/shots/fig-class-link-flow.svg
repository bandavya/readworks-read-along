<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" role="img" aria-label="A teacher creates a prototype class link with optional made-up roster. The student link shows every name; after a visitor chooses one, the classic reader sends new coarse events for the assigned passage to a configured server, and the teacher dashboard displays yes or audio level. Nothing verifies the visitor’s identity, so anyone with the link can choose any name. Choosing not on this list sends no class report. The server is not in this repository."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="388" class="bg"/><text x="20" y="25" class="b am">Prototype class link, made-up names; requires a configured server not in this repository</text><rect x="20" y="43" width="140" height="100" class="plate"/><text x="32" y="67" class="b s">Teacher makes link</text><text x="32" y="89" class="s">Passage + sound,</text><text x="32" y="105" class="s">voice, reader</text><text x="32" y="121" class="s">view, optional</text><text x="32" y="137" class="s">roster</text><path d="M160 100H214" class="li-l" marker-end="url(#a-li)"/><text x="187" y="70" class="xs li" text-anchor="middle">student</text><text x="187" y="84" class="xs li" text-anchor="middle">link</text><rect x="214" y="43" width="170" height="138" class="plate"/><text x="226" y="67" class="b s">Who's reading?</text><text x="226" y="91" class="s">Student A</text><text x="226" y="113" class="s">Student B</text><text x="226" y="141" class="s li">I'm not on this list</text><text x="226" y="165" class="s am">Every name is visible.</text><path d="M384 100H438" class="li-l" marker-end="url(#a-li)"/><text x="411" y="70" class="xs li" text-anchor="middle">chosen</text><text x="411" y="84" class="xs li" text-anchor="middle">name</text><rect x="438" y="43" width="150" height="138" class="plate"/><text x="450" y="67" class="b s">Classic reader</text><text x="450" y="91" class="s">New events only,</text><text x="450" y="109" class="s">assigned passage</text><text x="450" y="127" class="s">only: yes or</text><text x="450" y="145" class="s">audio level</text><path d="M588 100H642" class="li-l" marker-end="url(#a-li)"/><text x="615" y="70" class="xs li" text-anchor="middle">coarse</text><text x="615" y="84" class="xs li" text-anchor="middle">report</text><rect x="642" y="43" width="98" height="138" class="dash"/><text x="652" y="67" class="b s">Server</text><text x="652" y="92" class="s">Stores coarse</text><text x="652" y="111" class="s">progress for</text><text x="652" y="130" class="s">teacher link</text><path d="M691 181V228" class="li-d" marker-end="url(#a-li)"/><text x="681" y="210" class="xs li" text-anchor="end">class rows</text><rect x="438" y="228" width="302" height="73" class="plate"/><text x="450" y="252" class="b s">Teacher dashboard</text><text x="450" y="278" class="s">Yes or level under each name.</text><path d="M299 181V227" class="am-l" marker-end="url(#a-am)"/><rect x="20" y="231" width="382" height="70" class="flag"/><text x="34" y="255" class="b s">No identity check at the name picker.</text><text x="34" y="280" class="s">Anyone with the link can choose any name.</text><rect x="20" y="322" width="720" height="53" class="gone"/><text x="34" y="346" class="s">'I'm not on this list' sends no class report; reading continues.</text><text x="34" y="365" class="s mu">The focused reader counts nothing and is not the class-link destination.</text></svg>
