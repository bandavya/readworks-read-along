<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Focused and classic players use a speed slider. Two sliders are drawn to scale: a standard passage spans 0.75 to 2 times speed, and the younger readers view spans 0.75 to 1.25 times speed. The non-focused Mix reader instead uses four speed buttons at 0.75, 1, 1.5, and 2 times speed."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="400" class="bg"/><text x="20" y="26" class="era">Focused and classic players: speed slider</text><text x="20" y="81" class="b">Standard passage</text><rect x="263.2" y="63" width="77.60000000000008" height="18" class="lit"/><path d="M205 72H690" class="li-l"/><rect x="296" y="65" width="12" height="14" class="pivot"/><text x="205" y="101" class="s mu">0.75×  Slower</text><path d="M302 80V110" class="mu-l"/><text x="302" y="124" class="s" text-anchor="middle">1×  Normal</text><text x="690" y="101" class="s mu" text-anchor="end">2×  Faster</text><text x="20" y="173" class="b">Younger readers</text><rect x="350.5" y="155" width="194.0000000000001" height="18" class="lit"/><path d="M205 164H690" class="li-l"/><rect x="441.5" y="157" width="12" height="14" class="pivot"/><text x="205" y="193" class="s mu">0.75×  Slower</text><path d="M447.5 172V202" class="mu-l"/><text x="447.5" y="216" class="s" text-anchor="middle">1×  Normal</text><text x="690" y="193" class="s mu" text-anchor="end">1.25×  Faster</text><rect x="20" y="234" width="720" height="54" class="sf"/><rect x="34" y="247" width="14" height="12" class="lit"/><text x="54" y="257" class="b s">Near normal</text><text x="148" y="257" class="s">Shaded: dragging from 0.9× through 1.1× settles on 1×.</text><text x="34" y="277" class="s mu">The chosen rate is saved in this browser; the same recording and word times stay in use.</text><text x="20" y="314" class="xs mu">Scale and limits: SpeedSlider.vue. The slider can stop between the labeled marks.</text><text x="20" y="344" class="b s">Non-focused Mix reader: four speed buttons</text><rect x="20" y="353" width="128" height="34" class="plate"/><text x="84" y="375" class="s" text-anchor="middle">0.75x</text><rect x="160" y="353" width="107" height="34" class="plate"/><text x="213.5" y="375" class="s" text-anchor="middle">1x</text><rect x="279" y="353" width="128" height="34" class="plate"/><text x="343" y="375" class="s" text-anchor="middle">1.5x</text><rect x="419" y="353" width="107" height="34" class="plate"/><text x="472.5" y="375" class="s" text-anchor="middle">2x</text></svg>
