<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 374" role="img" aria-label="A data/index.json row for demo-passage-001 lists its ID, title, grade, lexile, 46 words, and a generated voice. The library shows the summary and uses the ID to load the full reader record. The publishing step writes the row after the MP3 and record, and the website publisher merges any bundled index with live rows, keeping live rows for duplicate IDs."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="374" class="bg"/><text x="20" y="27" class="era">A short public row points to the full story</text><rect x="20" y="45" width="720" height="82" class="plate"/><text x="34" y="69" class="b mono">data/index.json</text><text x="34" y="94" class="b s">uuid</text><text x="196" y="94" class="b s">title</text><text x="440" y="94" class="b s">grade</text><text x="504" y="94" class="b s">lexile</text><text x="583" y="94" class="b s">words</text><text x="649" y="94" class="b s">voices</text><text x="34" y="115" class="mono">demo-passage-001</text><text x="196" y="115" class="s">A Very Small Garden</text><text x="440" y="115" class="s">2</text><text x="504" y="115" class="s">430</text><text x="583" y="115" class="s">46</text><text x="649" y="115" class="xs">generated</text><path d="M192 127V164" class="li-l" marker-end="url(#a-li)"/><text x="202" y="152" class="xs li">read by</text><path d="M560 169V130" class="li-l" marker-end="url(#a-li)"/><text x="570" y="152" class="xs li">after record</text><rect x="20" y="169" width="340" height="78" class="plate"/><text x="34" y="193" class="b">Library reads the row</text><text x="34" y="215" class="s">Shows title, level, length and voices</text><text x="34" y="234" class="s">Selecting uuid loads data/&lt;uuid>.json</text><rect x="380" y="169" width="360" height="78" class="plate"/><text x="394" y="193" class="b">Publishing step writes the row</text><text x="394" y="215" class="s">After copied MP3 + data/&lt;uuid>.json</text><text x="394" y="234" class="s">Later deletion does not remove its row</text><rect x="20" y="265" width="720" height="70" class="sf"/><text x="34" y="291" class="b s">Website publisher, when frontend/data/index.json exists</text><text x="34" y="317" class="s">Merges bundled rows with live rows by uuid; the live row wins.</text><text x="20" y="360" class="xs mu">Example row is the publishing step’s output shape for the demo source, after a successful publication.</text></svg>
