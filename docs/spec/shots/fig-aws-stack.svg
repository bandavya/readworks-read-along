<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 536" role="img" aria-label="The default path runs left to right: passage upload or API start; load, clean, fingerprint and check the cache; submit the audio request; check outputs; write the job record and passage copy; publish to reader; record metrics and finish. Switches add recognition for word times with the Ruth voice, a word check that can hold a take for a person, a signed submission entry, and turning reader publishing off. A cached passage can end at once, or go straight to publishing. Generation and publication failures each end the run."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="536" class="bg"/><text x="22" y="24" class="era">What happens when a passage lands</text><path d="M114 227H125" class="li-l" marker-end="url(#a-li)"/><path d="M218 227H229" class="li-l" marker-end="url(#a-li)"/><path d="M322 227H333" class="li-l" marker-end="url(#a-li)"/><path d="M426 227H437" class="li-l" marker-end="url(#a-li)"/><path d="M530 227H541" class="li-l" marker-end="url(#a-li)"/><path d="M634 227H645" class="li-l" marker-end="url(#a-li)"/><path d="M172 190V96" class="mu-l" marker-end="url(#a-mu)"/><text x="180" y="122" class="s mu">found,</text><text x="180" y="137" class="s mu">reader</text><text x="180" y="152" class="s mu">current</text><path d="M172 264V300H568V266" class="mu-l" marker-end="url(#a-mu)"/><text x="180" y="293" class="s mu">found, reader missing</text><path d="M276 190V128H282" class="li-d" marker-end="url(#a-li)"/><rect x="282" y="100" width="92" height="56" class="dash"/><text x="291" y="119" class="b s">Recognize</text><text x="291" y="134" class="b s">word times</text><rect x="386" y="100" width="92" height="56" class="dash"/><text x="395" y="119" class="b s">Recognize,</text><text x="395" y="134" class="b s">compare</text><path d="M360 156V188" class="li-d" marker-end="url(#a-li)"/><path d="M404 190V172H416V158" class="li-d" marker-end="url(#a-li)"/><path d="M456 156V188" class="li-d" marker-end="url(#a-li)"/><text x="282" y="92" class="xs li">Ruth voice on</text><text x="386" y="92" class="xs li">word check on</text><path d="M470 100V70" class="am-l" marker-end="url(#a-am)"/><rect x="378" y="26" width="112" height="42" class="flag"/><text x="387" y="45" class="b s">Held for</text><text x="387" y="60" class="b s">voice check</text><text x="477" y="88" class="s am">held</text><rect x="126" y="50" width="92" height="44" class="gone"/><text x="135" y="69" class="b s">Already</text><text x="135" y="84" class="b s">generated</text><path d="M602 190V158" class="mu-l" marker-end="url(#a-mu)"/><rect x="556" y="114" width="92" height="42" class="gone"/><text x="565" y="133" class="b s">Done, no</text><text x="565" y="148" class="b s">metrics</text><text x="610" y="180" class="xs mu">existing audio</text><path d="M498 264V278H706V266" class="li-d" marker-end="url(#a-li)"/><text x="612" y="292" class="xs li">reader publishing off</text><rect x="22" y="190" width="92" height="74" class="plate"/><text x="31" y="212" class="b s">Passage</text><text x="31" y="228" class="b s">upload, or</text><text x="31" y="244" class="b s">API start</text><rect x="126" y="190" width="92" height="74" class="plate"/><text x="135" y="212" class="b s">Load, clean,</text><text x="135" y="228" class="b s">fingerprint,</text><text x="135" y="244" class="b s">check cache</text><rect x="230" y="190" width="92" height="74" class="plate"/><text x="239" y="212" class="b s">Submit</text><text x="239" y="228" class="b s">audio, wait</text><text x="239" y="244" class="b s">until done</text><rect x="334" y="190" width="92" height="74" class="plate"/><text x="343" y="212" class="b s">Check</text><text x="343" y="228" class="b s">outputs</text><rect x="438" y="190" width="92" height="74" class="plate"/><text x="447" y="212" class="b s">Write job</text><text x="447" y="228" class="b s">record and</text><text x="447" y="244" class="b s">passage copy</text><rect x="542" y="190" width="92" height="74" class="plate"/><text x="551" y="212" class="b s">Publish</text><text x="551" y="228" class="b s">to reader</text><rect x="646" y="190" width="92" height="74" class="plate"/><text x="655" y="212" class="b s">Record</text><text x="655" y="228" class="b s">metrics,</text><text x="655" y="244" class="b s">done</text><path d="M276 264V340" class="mu-l" marker-end="url(#a-mu)"/><path d="M380 264V340" class="mu-l" marker-end="url(#a-mu)"/><rect x="222" y="342" width="262" height="56" class="gone"/><text x="231" y="361" class="b s">Generation failed</text><text x="231" y="376" class="s mu">audio, word-time recognition or output check</text><path d="M604 264V340" class="mu-l" marker-end="url(#a-mu)"/><rect x="538" y="342" width="176" height="56" class="gone"/><text x="547" y="361" class="b s">Publication failure</text><text x="547" y="376" class="s mu">recorded, and can be retried</text><path d="M68 156V188" class="li-d" marker-end="url(#a-li)"/><rect x="22" y="100" width="92" height="56" class="dash"/><text x="31" y="119" class="b s">Signed</text><text x="31" y="134" class="b s">submission</text><text x="22" y="92" class="xs li">passage API on</text><path d="M22 432H52" class="li-l"/><text x="60" y="436" class="s">default path</text><path d="M150 432H180" class="li-d"/><text x="188" y="436" class="s">added by a switch</text><rect x="312" y="425" width="22" height="14" class="flag"/><text x="342" y="436" class="s">waits for a person</text><rect x="470" y="425" width="22" height="14" class="gone"/><text x="500" y="436" class="s">an ending</text><rect x="22" y="454" width="716" height="70" class="sf"/><text x="34" y="474" class="b s">Where things live</text><text x="34" y="494" class="s">Passage store</text><text x="34" y="511" class="xs mu">private</text><text x="150" y="494" class="s">Recording store</text><text x="150" y="511" class="xs mu">private</text><text x="276" y="494" class="s">Reader site store</text><text x="276" y="511" class="xs mu">private</text><path d="M392 490H426" class="li-l" marker-end="url(#a-li)"/><text x="434" y="494" class="s">Public delivery network</text><text x="434" y="511" class="xs mu">serves the reader</text><text x="610" y="494" class="s">Job table</text><text x="610" y="511" class="xs mu">one row per job</text></svg>
