<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" role="img" aria-label="The recording's clock drives the highlight. At one tick the engine looks in the timing list for the latest word whose start has passed, and that word number lights up on the page and stays in view above the player. Dragging the player, changing the pace or switching the voice all act on the clock. A pace change leaves the times alone, and a voice switch brings that voice's own list and resumes at the same word. A tap on a word jumps the clock to that word."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="444" class="bg"/><text x="20" y="26" class="era">What can move the clock</text><rect x="170" y="36" width="118" height="46" class="sf"/><text x="179" y="55" class="b s">Drag the player</text><text x="179" y="72" class="s mu">to any point</text><path d="M229 82V106" class="mu-l" marker-end="url(#a-mu)"/><rect x="298" y="36" width="120" height="46" class="sf"/><text x="307" y="55" class="b s">Change the pace</text><text x="307" y="72" class="s mu">the times stay put</text><path d="M358 82V106" class="mu-l" marker-end="url(#a-mu)"/><rect x="428" y="36" width="128" height="46" class="sf"/><text x="437" y="55" class="b s">Switch the voice</text><text x="437" y="72" class="s mu">resumes at that word</text><path d="M492 82V106" class="mu-l" marker-end="url(#a-mu)"/><text x="20" y="126" class="b s">The recording's clock</text><text x="20" y="142" class="xs mu">one tick, at 0.40 s</text><rect x="170" y="112" width="500" height="30" class="sf"/><path d="M170.0 126.2V127.8M174.0 126.2V127.8M178.0 125.6V128.4M182.0 122.5V131.5M186.0 120.6V133.4M190.0 121.7V132.3M194.0 119.0V135.0M198.0 121.7V132.3M202.0 120.5V133.5M206.0 119.2V134.8M210.0 119.0V135.0M214.0 117.2V136.8M218.0 115.7V138.3M222.0 118.0V136.0M226.