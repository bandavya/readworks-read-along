<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 904" role="img" aria-label="A tall data flow from a passage source in the content bucket through Polly output and canonical audio in the audio bucket, then a manifest and content derivative, then a copied MP3, reader record and library index in the website bucket. A DynamoDB job row tracks the run, with a note beside each step that writes to it. The browser reads the index and record and seeks the audio when a child taps a numbered word. Dashed boxes show optional signed intake, voice checking and the held-take note; a gray box marks the local website build and muted browser checks."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="904" class="bg"/><text x="24" y="29" class="lg">One passage, from source file to a word tap</text><text x="24" y="48" class="xs mu">Solid blue = default route   ·   dashed blue = a switch, off by default   ·   gray = local work</text><rect x="20" y="84" width="530" height="144" class="sf"/><text x="32" y="105" class="b s">1  CONTENT STORE  ·  private S3 bucket</text><rect x="34" y="119" width="250" height="46" class="plate"/><text x="44" y="138" class="b s">Passage source</text><text x="44" y="156" class="mono">passages/&lt;id>.json</text><text x="298" y="136" class="s">Upload writes this file.</text><text x="298" y="152" class="s">The upload notice starts the</text><text x="298" y="168" class="s">workflow, which reads the text.</text><rect x="34" y="176" width="250" height="46" class="dash"/><text x="44" y="195" class="b s">Optional signed intake</text><text x="44" y="213" class="mono">api-jobs/&lt;id>.json</text><text x="298" y="192" class="xs li">Writes passages/&lt;id>.json too.</text><text x="298" y="208" class="xs li">Switch passageApi=true; off here.</text><path d="M260 228V250" class="li-l" marker-end="url(#a-li)"/><text x="270" y="243" class="xs mu">normalized text + voice settings</text><rect x="20" y="250" width="530" height="186" class="sf"/><text x="32" y="271" class="b s">2  AUDIO STORE  ·  private S3 bucket</text><rect x="34" y="284" width="210" height="64" class="plate"/><text x="44" y="303" class="b s">Polly output</text><text x="44" y="321" class="mono">polly/&lt;audioId>/…</text><text x="44" y="336" class="mono">MP3 + raw word marks</text><path d="M244 316H274" class="li-l" marker-end="url(#a-li)"/><rect x="274" y="284" width="262" height="64" class="plate"/><text x="284" y="303" class="b s">Canonical media</text><text x="284" y="321" class="mono">audio/&lt;audioId>.mp3</text><text x="284" y="336" class="mono">audio/&lt;audioId>.speechmarks.json</text><text x="34" y="367" class="xs mu">Worker validates, then copies the MP3 and writes the marks as JSON.</text><rect x="34" y="384" width="502" height="44" class="dash"/><text x="44" y="403" class="xs">Ruth path, reported live: Transcribe writes transcribe/&lt;job>.json,</text><text x="44" y="419" class="xs">and the worker makes the word marks from it.</text><path d="M500 384V348" class="li-d" marker-end="url(#a-li)"/><path d="M260 436V458" class="li-l" marker-end="url(#a-li)"/><text x="270" y="451" class="xs mu">media keys + checks</text><rect x="20" y="458" width="530" height="112" class="sf"/><text x="32" y="479" class="b s">3  CONTENT STORE  ·  same private bucket as source</text><rect x="34" y="490" width="160" height="72" class="plate"/><text x="44" y="509" class="b s">Recording receipt</text><text x="44" y="526" class="mono">manifests/&lt;id>.json</text><text x="44" y="543" class="xs mu">Media keys + status</text><rect x="205" y="490" width="160" height="72" class="plate"/><text x="215" y="509" class="b s">Passage copy</text><text x="215" y="526" class="mono">content/&lt;id>.json</text><text x="215" y="543" class="xs mu">Source + audioManifest</text><rect x="376" y="490" width="160" height="72" class="dash"/><text x="386" y="509" class="b s">Held-take note</text><text x="386" y="526" class="mono">review/&lt;id>.json</text><text x="386" y="543" class="xs li">Switch qualityGate=true</text><text x="386" y="557" class="xs li">Only if a take is held</text><path d="M260 570V592" class="li-l" marker-end="url(#a-li)"/><text x="270" y="585" class="xs mu">source + marks + MP3</text><rect x="20" y="592" width="530" height="178" class="sf"/><text x="32" y="613" class="b s">4  WEBSITE STORE  ·  private S3 bucket, public delivery</text><rect x="34" y="626" width="236" height="58" class="plate"/><text x="44" y="645" class="b s">Copied recording</text><text x="44" y="663" class="mono">audio/&lt;id>/&lt;digest>.mp3</text><text x="44" y="678" class="mono">from the canonical MP3</text><path d="M270 655H300" class="li-l" marker-end="url(#a-li)"/><text x="285" y="647" class="xs mu" text-anchor="middle">then</text><rect x="300" y="626" width="236" height="58" class="plate"/><text x="310" y="645" class="b s">Reader record</text><text x="310" y="663" class="mono">data/&lt;id>.json</text><text x="310" y="678" class="mono">numbered words + time rows</text><path d="M418 684V700" class="li-l" marker-end="url(#a-li)"/><text x="428" y="696" class="xs mu">then</text><rect x="300" y="700" width="236" height="58" class="plate"/><text x="310" y="719" class="b s">Library list</text><text x="310" y="737" class="mono">data/index.json</text><text x="310" y="752" class="mono">then guide clips on Ruth</text><rect x="34" y="700" width="236" height="58" class="dash"/><text x="44" y="719" class="xs">Switch readerBridge=false:</text><text x="44" y="734" class="xs">no website copy is written.</text><text x="44" y="749" class="xs">Default: the step is on.</text><path d="M260 770V792" class="li-l" marker-end="url(#a-li)"/><text x="270" y="785" class="xs mu">index → record → MP3</text><rect x="20" y="792" width="530" height="80" class="plate"/><text x="32" y="813" class="b s">5  CHILD’S BROWSER</text><text x="32" y="834" class="s">Library reads data/index.json; story reads data/&lt;id>.json.</text><text x="32" y="852" class="s">Tap a numbered word: its voice.t row seeks the copied MP3.</text><rect x="584" y="792" width="156" height="80" class="gone"/><text x="594" y="812" class="xs">Local only:</text><text x="594" y="827" class="xs">build-frontend.js makes</text><text x="594" y="842" class="xs">the site shell; browser</text><text x="594" y="857" class="xs">checks ran muted.</text><rect x="584" y="84" width="156" height="686" class="sf"/><text x="594" y="105" class="b s">JOB TABLE</text><text x="594" y="122" class="xs mu">DynamoDB, one row per</text><text x="594" y="137" class="xs mu">passage and text hash</text><rect x="592" y="146" width="140" height="87" class="plate"/><text x="600" y="166" class="xs">Status: running, then</text><text x="600" y="181" class="xs">approved (default) or</text><text x="600" y="196" class="xs">generated (checked).</text><text x="600" y="211" class="xs">Review: unreviewed or</text><text x="600" y="226" class="xs">needs human check.</text><path d="M550 176H584" class="li-l" marker-end="url(#a-li)"/><rect x="592" y="278" width="140" height="42" class="plate"/><text x="600" y="298" class="xs">Canonical keys</text><text x="600" y="313" class="xs">stored on the row.</text><path d="M550 300H584" class="li-l" marker-end="url(#a-li)"/><rect x="592" y="346" width="140" height="72" class="plate"/><text x="600" y="366" class="xs">Next upload reuses</text><text x="600" y="381" class="xs">approved (default) or</text><text x="600" y="396" class="xs">generated (checked)</text><text x="600" y="411" class="xs">for matching ID + hash.</text><path d="M584 376H550" class="li-l" marker-end="url(#a-li)"/><rect x="592" y="498" width="140" height="42" class="plate"/><text x="600" y="518" class="xs">Media status</text><text x="600" y="533" class="xs">updated.</text><path d="M550 518H584" class="li-l" marker-end="url(#a-li)"/><rect x="592" y="648" width="140" height="57" class="plate"/><text x="600" y="668" class="xs">Marked published</text><text x="600" y="683" class="xs">by the publishing</text><text x="600" y="698" class="xs">step.</text><path d="M550 674H584" class="li-l" marker-end="url(#a-li)"/><text x="24" y="892" class="xs mu">Team reports deployed Ruth + voice check; default setup uses Joanna without the check.</text></svg>
