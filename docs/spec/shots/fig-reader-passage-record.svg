<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" role="img" aria-label="The publishing step writes data/demo-passage-001.json. Its story fields identify and label the passage. Its HTML numbers each article word, and each number picks one time range from the generated voice, which also holds an audio path, 46 timing slots, four title lead slots, and a needs human check review label. The browser loads the record after a library choice. The times drawn are made up."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="452" class="bg"/><text x="20" y="28" class="era">One reader copy, loaded after a library choice</text><rect x="20" y="43" width="720" height="50" class="sf"/><text x="34" y="64" class="b mono">data/demo-passage-001.json</text><text x="34" y="83" class="s mu">Written by the publishing step. Read by the browser app when a story opens.</text><rect x="20" y="108" width="330" height="258" class="plate"/><text x="34" y="132" class="b">Story fields</text><text x="34" y="160" class="mono">uuid       demo-passage-001</text><text x="34" y="184" class="mono">title      A Very Small Garden</text><text x="34" y="208" class="mono">grade      2       lexile  430</text><text x="34" y="232" class="mono">lang       EN</text><text x="34" y="256" class="mono">words      46      wordcount  46</text><text x="34" y="280" class="mono">title_words  [A, Very, Small, Garden]</text><rect x="366" y="108" width="374" height="258" class="plate"/><text x="380" y="132" class="b">Article and voice</text><text x="380" y="152" class="s mu">html: each article word is numbered (data-i)</text><text x="413" y="172" class="s li" text-anchor="middle">0</text><rect x="380" y="178" width="66" height="26" class="tile "/><text x="413" y="195.5" text-anchor="middle">The</text><path d="M413 204V222" class="li-l" marker-end="url(#a-li)"/><rect x="380" y="224" width="66" height="26" class="tile "/><text x="413" y="241.5" text-anchor="middle">0.1–0.4</text><text x="483" y="172" class="s li" text-anchor="middle">1</text><rect x="450" y="178" width="66" height="26" class="tile "/><text x="483" y="195.5" text-anchor="middle">garden</text><path d="M483 204V222" class="li-l" marker-end="url(#a-li)"/><rect x="450" y="224" width="66" height="26" class="tile "/><text x="483" y="241.5" text-anchor="middle">0.4–0.8</text><text x="553" y="172" class="s li" text-anchor="middle">2</text><rect x="520" y="178" width="66" height="26" class="tile "/><text x="553" y="195.5" text-anchor="middle">was</text><path d="M553 204V222" class="li-l" marker-end="url(#a-li)"/><rect x="520" y="224" width="66" height="26" class="tile "/><text x="553" y="241.5" text-anchor="middle">0.8–1.0</text><text x="623" y="172" class="s li" text-anchor="middle">3</text><rect x="590" y="178" width="66" height="26" class="tile "/><text x="623" y="195.5" text-anchor="middle">small,</text><path d="M623 204V222" class="li-l" marker-end="url(#a-li)"/><rect x="590" y="224" width="66" height="26" class="tile "/><text x="623" y="241.5" text-anchor="middle">1.0–1.5</text><text x="693" y="172" class="s li" text-anchor="middle">4</text><rect x="660" y="178" width="66" height="26" class="tile "/><text x="693" y="195.5" text-anchor="middle">but</text><path d="M693 204V222" class="li-l" marker-end="url(#a-li)"/><rect x="660" y="224" width="66" height="26" class="tile "/><text x="693" y="241.5" text-anchor="middle">1.5–1.8</text><text x="380" y="270" class="s mu">voices[0].t: the same number picks its time range</text><text x="380" y="286" class="xs mu">(made-up times; the real list has 46 slots)</text><text x="380" y="312" class="mono">voices[0].audio   audio/&lt;id>/&lt;digest>.mp3</text><text x="380" y="329" class="mono">voices[0].lead   4 title slots</text><text x="380" y="346" class="mono">voices[0].review  needs human check</text><path d="M185 366V388" class="li-l" marker-end="url(#a-li)"/><path d="M553 366V388" class="li-l" marker-end="url(#a-li)"/><text x="26" y="408" class="s">Browser labels and displays the story</text><text x="386" y="408" class="s">Browser plays audio and lights word data-i from t[i]</text><text x="20" y="440" class="xs mu">Shape from the publishing code and the demo source. Audio path and timing rows appear only after publication.</text></svg>
