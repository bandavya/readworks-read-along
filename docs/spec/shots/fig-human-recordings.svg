s mu">Word times match this file</text><path d="M234 119H265" class="li-l" marker-end="url(#a-li)"/><text x="238" y="103" class="xs li">file</text><rect x="270" y="46" width="215" height="150" class="flag"/><text x="279" y="65" class="b s">Reviewer hears exact file</text><text x="279" y="80" class="s mu">Typed name, listening check,</text><text x="279" y="95" class="s mu">matching file fingerprint</text><path d="M485 119H516" class="li-l" marker-end="url(#a-li)"/><text x="490" y="103" class="xs li">yes</text><rect x="520" y="46" width="220" height="150" class="plate"/><text x="529" y="65" class="b s">Reader files</text><text x="529" y="80" class="s mu">audio/&lt;id>-volunteer-</text><text x="529" y="95" class="s mu">&lt;sha>.mp3</text><text x="529" y="110" class="s mu">data/&lt;id>.json: human voice</text><text x="529" y="125" class="s mu">data/index.json: voice list</text><path d="M380 196V238H155V260" class="am-l" marker-end="url(#a-am)"/><text x="168" y="228" class="xs am">send back</text><rect x="20" y="265" width="270" height="65" class="gone"/><text x="29" y="284" class="b s">Volunteer revises take</text><text x="29" y="299" class="s mu">No reader change from submission.</text><path d="M630 196V238H577V260" class="mu-l" marker-end="url(#a-mu)"/><rect x="390" y="265" width="350" height="94" class="sf"/><text x="399" y="284" class="b s">Publication record</text><text x="399" y="299" class="s mu">Exact file hash and reviewer claim;</text><text x="399" y="314" class="s mu">earlier human voice saved for undo.</text><text x="399" y="329" class="s mu">Reapply restores it after a data rebuild.</text><text x="20" y="380" class="xs mu">Approval refuses a take that misses the story or has broken word timing.</text><text x="20" y="398" class="xs mu">Undo restores the earlier voice entry; the older audio file remains.</text></svg>
