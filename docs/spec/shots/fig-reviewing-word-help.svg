<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" role="img" aria-label="A reviewer reads and listens to a generated word-help item, then approves it or marks it as needing a fix. The choice is saved in this browser with the text hash and verified audio bytes. A JSON export can be downloaded, but the script to apply it to passage data is absent from this repository. Edited text or audio invalidates the old approval. The optional send-to-server route has no receiver here. The example row is made up."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="388" class="bg"/><rect x="20" y="34" width="240" height="204" class="plate"/><text x="34" y="56" class="b">One review row</text><rect x="110" y="67" width="37" height="20" class="lit"/><text x="34" y="82" class="s">…it was full of color.</text><text x="34" y="106" class="xs mu">Generated meaning</text><rect x="34" y="112" width="170" height="4" class="fline"/><rect x="34" y="122" width="120" height="4" class="fline"/><text x="34" y="148" class="xs mu">Parts guide + spoken clips</text><rect x="34" y="154" width="44" height="24" class="tile "/><text x="56" y="170.5" text-anchor="middle">col</text><rect x="82" y="154" width="44" height="24" class="tile "/><text x="104" y="170.5" text-anchor="middle">or</text><path d="M138 160l10 6l-10 6z" class="fli"/><path d="M164 160l10 6l-10 6z" class="fli"/><rect x="34" y="194" width="74" height="30" class="plate"/><text x="71" y="214" class="s" text-anchor="middle">Approve</text><rect x="114" y="194" width="132" height="30" class="plate"/><text x="180" y="214" class="s" text-anchor="middle">Needs a fix + note</text><path d="M260 120H326" class="li-l" marker-end="url(#a-li)"/><text x="266" y="96" class="xs li">choice +</text><text x="266" y="110" class="xs li">fingerprints</text><rect x="330" y="34" width="180" height="204" class="plate"/><text x="344" y="56" class="b">This browser</text><text x="344" y="82" class="s">Local choice saved with</text><text x="344" y="100" class="s">the text hash and the</text><text x="344" y="118" class="s">verified audio bytes</text><text x="344" y="160" class="s li">Checked here only</text><text x="344" y="190" class="s am">No real sign-in</text><path d="M510 120H576" class="li-d" marker-end="url(#a-li)"/><text x="530" y="106" class="xs li">export</text><rect x="580" y="34" width="160" height="204" class="dash"/><text x="594" y="56" class="b">JSON file</text><text x="594" y="82" class="s">Can be downloaded</text><text x="594" y="112" class="s">Applying it to the</text><text x="594" y="130" class="s">passage data needs</text><text x="594" y="148" class="s">a script</text><text x="594" y="190" class="s am">Script absent here</text><path d="M420 238V262" class="am-l" marker-end="url(#a-am)"/><rect x="200" y="266" width="440" height="62" class="flag"/><text x="214" y="290" class="s">If the text or audio changes, the old approval stops counting.</text><text x="214" y="311" class="s mu">A person must check the new version.</text><text x="20" y="354" class="s am">The optional send-to-server route has no receiver in this repository.</text><text x="20" y="374" class="xs mu">A made-up example row.</text></svg>
