<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" role="img" aria-label="A waveform of a spoken sentence with a start mark at each word. The marks are matched to the numbered words in the passage and become a table. Each end is the next word's start, the last word's end is its start plus an estimated 0.4 seconds, and a punctuation-only slot has no highlight. The default voice gets starts from the speech service, and the Ruth voice from speech recognition."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
