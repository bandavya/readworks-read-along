<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" role="img" aria-label="On a local computer, a volunteer reads a passage aloud. The tool keeps the original take and prepares a cleaned take with word times and flags. Submission sends the exact file to a reviewer, who listens and either sends it back or approves it. Approval refuses a take that does not match the story or has broken timing. Only approval adds a human voice to the reader. The reviewer name is typed, without sign-in."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="385" class="bg"/><text x="20" y="27" class="era">Local recorder on this computer · no AWS</text><rect x="20" y="46" width="190" height="180" class="plate"/><text x="29" y="65" class="b s">Passage on screen</text><text x="32" y="95" class="s">The passage text</text><text x="32" y="111" class="s">Volunteer reads it aloud</text><path d="M32.0 158.9V161.1M35.4 158.9V161.1M38.8 158.9V161.1M42.2 156.2V163.8M45.6 148.3V171.7M49.0 144.1V175.9M52.4 147.6V172.4M55.8 142.9V177.1M59.2 149.7V170.3M62.6 149.3V170.7M66.0 149.9V170.1M69.4 153.6V166.4M72.8 158.9V161.1M76.2 158.9V161.1M79.6 158.9V161.1M83.0 155.7V164.3M86.4 149.5V170.5M89.8 148.7V171.3M93.2 150.8V169.2M96.6 149.6V170.4M100.0 147.9V172.1M103.4 143.1V176.9M106.8 146.5V173.5M110.2 150.4V169.6M113.6 141.8V178.2M117.0 149.1V170.9M120.4 152.8V167.2M123.8 152.6V167.4M127.2 155.2V164.8M130.6 158.9V161.1M134.0 158.9V161.1M137.4 158.9V161.1M140.8 158.9V161.1M144.2 153.7V166.3M147.6 153.0V167.0M151.0 147.8V172.2M154.4 147.6V172.4M157.8 148.5V171.5M161.2 149.9V170.1M164.6 144.8V175.2M168.0 144.2V175.8M171.4 141.7V178.3M174.8 147.9V172.1M178.2 149.7V170.3M181.6 147.2V172.8M185.0 150.0V170.0M188.4 155.5V164.5M191.8 158.9V161.1M195.2 158.9V161.1" class="bars"/><text x="32" y="205" class="xs mu">Original take kept</text><path d="M210 136H242" class="li-l" marker-end="url(#a-li)"/><text x="212" y="122" class="xs li">voice</text><rect x="246" y="46" width="228" height="180" class="plate"/><text x="255" y="65" class="b s">Cleaned take and word times</text><path d="M258.0 97.1V98.9M261.4 97.1V98.9M264.8 97.1V98.9M268.2 97.1V98.9M271.6 94.0V102.0M275.0 87.8V108.2M278.4 84.7V111.3M281.8 87.7V108.3M285.2 83.5V112.5M288.6 89.0V107.0M292.0 87.9V108.1M295.4 87.3V108.7M298.8 88.8V107.2M302.2 89.4V106.6M305.6 92.9V103.1M309.0 97.1V98.9M312.4 97.1V98.9M315.8 97.1V98.9M319.2 97.1V98.9M322.6 92.4V103.6M326.0 92.5V103.5M329.4 91.1V104.9M332.8 89.3V106.7M336.2 85.1V110.9M339.6 87.0V109.0M343.0 89.7V106.3M346.4 80.8V115.2M349.8 86.6V109.4M353.2 89.3V106.7M356.6 86.4V109.6M360.0 82.8V113.2M363.4 86.5V109.5M366.8 90.9V105.1M370.2 90.2V105.8M373.6 93.6V102.4M377.0 97.1V98.9M380.4 97.1V98.9M383.8 97.1V98.9M387.2 97.1V98.9M390.6 97.1V98.9M394.0 95.5V100.5M397.4 93.9V102.1M400.8 90.0V106.0M404.2 88.1V107.9M407.6 84.8V111.2M411.0 88.0V108.0M414.4 88.1V107.9M417.8 83.5V112.5M421.2 83.6V112.4M424.6 88.3V107.7M428.0 82.4V113.6M431.4 81.3V114.7M434.8 83.3V112.7M438.2 89.3V106.7M441.6 85.2V110.8M445.0 89.0V107.0M448.4 90.3V105.7M451.8 94.9V101.1M455.2 97.1V98.9M458.6 97.1V98.9" class="bars"/><rect x="258" y="130" width="204" height="57" class="sf"/><text x="268" y="150" class="s">Page:  She found the old map.</text><text x="268" y="167" class="s">Heard: She found the old map.</text><text x="258" y="209" class="xs mu">Flags can be checked or reread</text><path d="M474 136H506" class="li-l" marker-end="url(#a-li)"/><text x="479" y="122" class="xs li">file</text><rect x="510" y="46" width="230" height="180" class="flag"/><text x="519" y="65" class="b s">Reviewer listens</text><g class="fmu"><circle cx="704" cy="59" r="4.800000000000001"/><path d="M695.2 75.8C695.2 65.4 712.8 65.4 712.8 75.8Z"/></g><text x="522" y="97" class="s">Submitted file fingerprint</text><text x="522" y="113" class="s">must match the file heard.</text><text x="522" y="129" class="s">Typed name + listening check</text><rect x="522" y="168" width="93" height="34" class="gone"/><text x="531" y="190" class="s">Send back</text><rect x="625" y="168" width="103" height="34" class="plate"/><text x="635" y="190" class="s">Approve</text><path d="M674 226V258H420V275" class="li-l" marker-end="url(#a-li)"/><text x="440" y="250" class="xs li">approved MP3 + word times</text><rect x="280" y="279" width="280" height="52" class="plate"/><text x="289" y="298" class="b s">Reader: human voice</text><text x="289" y="313" class="s mu">Only an approved reading arrives here.</text><text x="20" y="348" class="xs mu">Approval is refused if the take misses the story or word timing is broken.</text><text x="20" y="367" class="xs mu">No sign-in: the reviewer name is a typed claim. A listening-quality test is not recorded.</text></svg>
