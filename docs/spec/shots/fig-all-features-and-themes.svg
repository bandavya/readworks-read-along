<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" role="img" aria-label="Opening All features reveals Demo controls with seven themes and screen choices. In the Signature reader it also reveals highlight colors, a voice visualization, line focus and a sound switch. The library adds a bookshelf layout and voice-shape maps. These are prototype comparison controls."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="366" class="bg"/><text x="20" y="26" class="era">After “All features”</text><rect x="20" y="42" width="720" height="152" class="plate"/><text x="34" y="65" class="b">Demo controls, opened</text><text x="34" y="91" class="s mu">Theme</text><rect x="89" y="72" width="88" height="32" class="tile "/><text x="133" y="92.5" text-anchor="middle">Signature</text><path d="M92 105h82" class="li-l"/><rect x="182" y="72" width="92" height="32" class="tile "/><text x="228" y="92.5" text-anchor="middle">ReadWorks</text><rect x="279" y="72" width="62" height="32" class="tile "/><text x="310" y="92.5" text-anchor="middle">Crisp</text><rect x="346" y="72" width="66" height="32" class="tile "/><text x="379" y="92.5" text-anchor="middle">Bright</text><rect x="417" y="72" width="82" height="32" class="tile "/><text x="458" y="92.5" text-anchor="middle">Storybook</text><rect x="504" y="72" width="94" height="32" class="tile "/><text x="551" y="92.5" text-anchor="middle">Soundwave</text><rect x="603" y="72" width="64" height="32" class="tile "/><text x="635" y="92.5" text-anchor="middle">Classic</text><text x="34" y="142" class="s mu">Screen</text><rect x="89" y="123" width="88" height="32" class="tile "/><text x="133" y="143.5" text-anchor="middle">Stories</text><rect x="184" y="123" width="75" height="32" class="tile "/><text x="221.5" y="143.5" text-anchor="middle">Read</text><rect x="266" y="123" width="86" height="32" class="tile "/><text x="309" y="143.5" text-anchor="middle">Kid view</text><text x="34" y="179" class="s mu">On a passage, a theme switch opens that story in the chosen look.</text><path d="M380 194V214" class="li-l" marker-end="url(#a-li)"/><rect x="20" y="218" width="720" height="114" class="sf"/><text x="34" y="242" class="b">More choices in the Signature reader</text><text x="34" y="269" class="s">Highlight color</text><rect x="140" y="255" width="22" height="18" class="lit"/><rect x="168" y="255" width="22" height="18" class="rev"/><rect x="196" y="255" width="22" height="18" class="sf"/><text x="250" y="269" class="s">Show the voice</text><rect x="355" y="249" width="46" height="30" class="tile "/><text x="378" y="268.5" text-anchor="middle">Off</text><text x="430" y="269" class="s">Focus</text><rect x="478" y="249" width="75" height="30" class="tile "/><text x="515.5" y="268.5" text-anchor="middle">One line</text><text x="574" y="269" class="s">Sound</text><rect x="623" y="249" width="80" height="30" class="tile "/><text x="663" y="268.5" text-anchor="middle">On</text><text x="34" y="310" class="s mu">The library also offers a bookshelf layout and voice-shape maps.</text><text x="20" y="355" class="xs mu">Prototype comparison controls. The first focused view keeps these out of the reading path.</text></svg>
