<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 454" role="img" aria-label="A scale from zero to twelve cents compares Polly costs for 2,900 normalized characters. Joanna neural uses two requests and costs 9.28 cents; Ruth generative uses one and costs 8.7 cents. An assumed 3.2-minute Transcribe job at an unconfirmed rate of 0.6 cents per minute adds 1.92 cents, making Ruth with timing 10.62 cents or Joanna with optional word check 11.2 cents. The Ruth deployment also makes vocabulary guide clips, which this chart excludes along with other costs."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="454" class="bg"/><text x="20" y="27" class="era">Estimated cost for a 2,900-character passage</text><text x="20" y="58" class="s mu">Voice requests use AWS Polly prices read Nov. 4, 2026</text><path d="M260 91V298" class="ln"/><text x="260" y="82" class="xs mu" text-anchor="middle">$0.00</text><path d="M357.5 91V298" class="ln"/><text x="357.5" y="82" class="xs mu" text-anchor="middle">$0.03</text><path d="M455 91V298" class="ln"/><text x="455" y="82" class="xs mu" text-anchor="middle">$0.06</text><path d="M552.5 91V298" class="ln"/><text x="552.5" y="82" class="xs mu" text-anchor="middle">$0.09</text><path d="M650 91V298" class="ln"/><text x="650" y="82" class="xs mu" text-anchor="middle">$0.12</text><text x="20" y="122" class="s">Joanna · neural × 2</text><rect x="260" y="105" width="301.6" height="25" class="fli"/><text x="665" y="123" class="b s">$0.0928</text><text x="20" y="169" class="s">Ruth · generative × 1</text><rect x="260" y="152" width="282.75" height="25" class="fli"/><text x="665" y="170" class="b s">$0.0870</text><text x="20" y="216" class="s">Ruth + timing recognition</text><rect x="260" y="199" width="282.75" height="25" class="fli"/><rect x="542.75" y="199" width="62.4" height="25" class="fam"/><text x="665" y="217" class="b s">$0.1062</text><text x="20" y="263" class="s">Joanna + optional word check</text><rect x="260" y="246" width="301.6" height="25" class="fli"/><rect x="561.6" y="246" width="62.4" height="25" class="fam"/><text x="665" y="264" class="b s">$0.1120</text><rect x="20" y="316" width="720" height="98" class="sf"/><rect x="34" y="333" width="13" height="13" class="fli"/><text x="57" y="345" class="s">Polly: 2,900 characters × requests × $16/M neural or $30/M generative</text><rect x="34" y="358" width="13" height="13" class="fam"/><text x="57" y="370" class="s">Recognition: assumed 3.2 minutes × $0.006/min = $0.0192 per job</text><text x="34" y="396" class="xs mu">Recognition rate in us-west-2 is unconfirmed; Ruth reuses its transcript for the optional check.</text><text x="20" y="438" class="xs mu">Excludes retries, guide clips, storage, compute, workflow, delivery, and human review.</text></svg>
