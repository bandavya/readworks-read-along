<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="A direct upload or optional signed submission writes a passage JSON file. Its arrival sends the ID and file location to the audio workflow, which closes up extra spacing and makes a fingerprint of the cleaned text plus voice, engine and language. A matching finished fingerprint reuses the recording; a changed one makes new audio."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="400" class="bg"/><text x="20" y="28" class="era">Two ways to place the same passage file</text><rect x="20" y="48" width="210" height="84" class="plate"/><text x="29" y="67" class="b s">Direct upload</text><text x="29" y="82" class="s mu">passages/&lt;id>.json</text><text x="29" y="97" class="s mu">Only public fields belong here</text><rect x="20" y="148" width="210" height="84" class="dash"/><text x="29" y="167" class="b s">Signed submission</text><text x="29" y="182" class="s mu">Off by default. Removes fields</text><text x="29" y="197" class="s mu">the reader should not show.</text><rect x="300" y="78" width="164" height="100" class="plate"/><text x="312" y="100" class="mono">passages/&lt;id>.json</text><text x="312" y="124" class="mono">text</text><text x="312" y="142" class="mono">passageId or uuid</text><text x="312" y="160" class="mono">title</text><path d="M230 90H264V118H296" class="li-l" marker-end="url(#a-li)"/><text x="236" y="82" class="s li">upload</text><path d="M230 190H264V140H296" class="li-d" marker-end="url(#a-li)"/><text x="236" y="207" class="s li">cleaned file</text><path d="M464 128H516" class="li-l" marker-end="url(#a-li)"/><text x="468" y="118" class="xs li">the file</text><rect x="520" y="90" width="220" height="78" class="pivot"/><text x="532" y="112" class="b s">File arrival notice</text><text x="532" y="130" class="s mu">Only for passages/*.json.</text><text x="532" y="146" class="s mu">Sends the ID and file location.</text><path d="M630 168V246" class="li-l" marker-end="url(#a-li)"/><text x="640" y="212" class="s li">ID + file location</text><rect x="20" y="250" width="720" height="112" class="plate"/><text x="32" y="272" class="b">Audio workflow</text><rect x="32" y="286" width="190" height="70" class="sf"/><text x="41" y="305" class="b s">Close up extra spacing</text><text x="41" y="320" class="s mu">in the text</text><path d="M222 317H246" class="li-l" marker-end="url(#a-li)"/><rect x="250" y="286" width="230" height="70" class="sf"/><text x="259" y="305" class="b s">Make a short fingerprint of</text><text x="259" y="320" class="s mu">cleaned text + voice +</text><text x="259" y="335" class="s mu">engine + language</text><path d="M480 317H500" class="li-l" marker-end="url(#a-li)"/><rect x="504" y="282" width="224" height="32" class="plate"/><text x="514" y="303" class="s">Same, already finished: reuse it</text><rect x="504" y="318" width="224" height="32" class="plate"/><text x="514" y="339" class="s">Changed: make new audio</text><text x="20" y="386" class="xs mu">The signed route is off by default. The direct upload has no API field or size filter.</text></svg>
