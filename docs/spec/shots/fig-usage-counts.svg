<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 468" role="img" aria-label="A table of eight counted actions in the classic and younger readers. All eight are totaled on the device. Six reach an assigned class report as a yes or a coarse level, with no count; play starts and reaching the end stay on the device. The focused reader counts nothing."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="468" class="bg"/><text x="20" y="26" class="b">Classic and younger readers: one passage on one device</text><rect x="20" y="40" width="720" height="66" class="sf"/><text x="34" y="78" class="b s">What gets counted</text><text x="330" y="60" class="b s">Device total</text><text x="330" y="78" class="xs mu">Local storage, no identity</text><text x="330" y="94" class="xs mu">Toggles, CSV export, delete</text><text x="540" y="60" class="b s">Class report, if assigned</text><text x="540" y="78" class="xs mu">Prototype server</text><text x="540" y="94" class="xs mu">Only after a name is picked</text><rect x="20" y="106" width="720" height="250" class="plate"/><text x="34" y="132" class="s">Passage opened</text><circle cx="338" cy="128" r="5.5" class="fli"/><rect x="540" y="114" width="96" height="24" class="tile "/><text x="588" y="130.5" text-anchor="middle">yes, no count</text><path d="M34 141H726" class="ln"/><text x="34" y="162" class="s">Narration play starts</text><circle cx="338" cy="158" r="5.5" class="fli"/><text x="540" y="162" class="s mu">stays on the device</text><path d="M34 171H726" class="ln"/><text x="34" y="192" class="s">Narration reaches end</text><circle cx="338" cy="188" r="5.5" class="fli"/><text x="540" y="192" class="s mu">stays on the device</text><path d="M34 201H726" class="ln"/><text x="34" y="222" class="s">Audio coverage</text><circle cx="338" cy="218" r="5.5" class="fli"/><rect x="540" y="204" width="96" height="24" class="tile "/><text x="588" y="220.5" text-anchor="middle">coarse level</text><path d="M34 231H726" class="ln"/><text x="34" y="252" class="s">Word taps</text><circle cx="338" cy="248" r="5.5" class="fli"/><rect x="540" y="234" width="96" height="24" class="tile "/><text x="588" y="250.5" text-anchor="middle">yes, no count</text><path d="M34 261H726" class="ln"/><text x="34" y="282" class="s">Replays</text><circle cx="338" cy="278" r="5.5" class="fli"/><rect x="540" y="264" width="96" height="24" class="tile "/><text x="588" y="280.5" text-anchor="middle">yes, no count</text><path d="M34 291H726" class="ln"/><text x="34" y="312" class="s">Word cards opened</text><circle cx="338" cy="308" r="5.5" class="fli"/><rect x="540" y="294" width="96" height="24" class="tile "/><text x="588" y="310.5" text-anchor="middle">yes, no count</text><path d="M34 321H726" class="ln"/><text x="34" y="342" class="s">Audio trouble</text><circle cx="338" cy="338" r="5.5" class="fli"/><rect x="540" y="324" width="96" height="24" class="tile "/><text x="588" y="340.5" text-anchor="middle">yes, no count</text><rect x="20" y="372" width="720" height="56" class="sf"/><text x="34" y="396" class="b s">Focused reader, the default first view: counts nothing.</text><text x="34" y="416" class="s mu">A separate Reading helper page counts word-help openings.</text><text x="20" y="454" class="xs mu">Dot = counted on the device. Source: dataKit/options.js, usage.js, report.js, MixReader.vue. Counts do not measure learning.</text></svg>
