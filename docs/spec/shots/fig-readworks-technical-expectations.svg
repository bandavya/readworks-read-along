<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-label="Cloud preparation makes audio and word times from passage text and publishes a library list, a passage document, and a separate audio file. The browser reads those files without generating timing. Current code uses Python 3.12 and a Python API. The stack falls back to us-east-1, the publish script falls back to us-west-2, and the team reports the live stack in us-west-2."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="365" class="bg"/><text x="20" y="26" class="era">Prepare once; the browser reads finished files</text><rect x="20" y="49" width="171" height="194" class="plate"/><text x="34" y="74" class="b">Cloud preparation</text><text x="34" y="102" class="s">Passage text</text><text x="34" y="128" class="s">Make audio + times</text><text x="34" y="154" class="s">Check word mapping</text><text x="34" y="180" class="s">Publish files</text><text x="34" y="220" class="xs li">Live stack: us-west-2</text><path d="M191 136H235" class="li-l" marker-end="url(#a-li)"/><text x="213" y="123" class="xs li" text-anchor="middle">writes</text><rect x="239" y="49" width="245" height="194" class="plate"/><text x="253" y="74" class="b">Stored results</text><rect x="253" y="91" width="217" height="35" class="sf"/><text x="265" y="114" class="mono">data/index.json</text><text x="375" y="114" class="xs">library list</text><rect x="253" y="134" width="217" height="35" class="sf"/><text x="265" y="157" class="mono">data/&lt;id>.json</text><text x="375" y="157" class="xs">text + times</text><rect x="253" y="177" width="217" height="35" class="sf"/><text x="265" y="200" class="mono">audio/&lt;id>/...</text><text x="375" y="200" class="xs">MP3 sound</text><text x="253" y="230" class="xs mu">Library list follows the MP3 and record.</text><path d="M484 136H530" class="li-l" marker-end="url(#a-li)"/><text x="507" y="123" class="xs li" text-anchor="middle">reads</text><rect x="534" y="49" width="206" height="194" class="plate"/><text x="548" y="74" class="b">Student browser</text><rect x="548" y="89" width="178" height="103" class="sf"/><text x="560" y="111" class="s">Article + word cue</text><text x="560" y="138" class="s">Play  •  tap  •  seek</text><text x="560" y="168" class="s mu">No timing generation</text><text x="548" y="221" class="xs mu">Vue reader</text><rect x="20" y="263" width="720" height="69" class="rev"/><text x="34" y="285" class="b am">Integration fit to confirm with ReadWorks</text><text x="34" y="306" class="s">Python 3.12 and a Python API here; earlier notes led with Python 3.14 and Node/Express.</text><text x="34" y="323" class="s">Stack fallback: us-east-1; publish script fallback and live stack: us-west-2.</text><text x="20" y="352" class="xs mu">Source: current code, earlier technical-brief leads, and the team's live-stack report.</text></svg>
