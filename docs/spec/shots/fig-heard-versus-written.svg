<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" role="img" aria-label="An optional check. Speech recognition listens to the finished recording and its words are compared with the page. A replaced word, a dropped word or an extra phrase each count as a difference, while spoken variants and listed name spellings are accepted. No blocking difference goes on to publish, labeled as needing a human check. A difference or a failed recognition holds the take, and an older voice can stay available."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="492" class="bg"/><text x="20" y="26" class="era">Off by default</text><rect x="20" y="34" width="170" height="60" class="dash"/><text x="29" y="53" class="b s">Finished recording</text><text x="29" y="68" class="s mu">already validated</text><path d="M190 66H208" class="li-l" marker-end="url(#a-li)"/><text x="214" y="70" class="s mu">Speech recognition writes down what it hears, then the words are compared</text><text x="202" y="121" class="b s" text-anchor="end">On the page</text><rect x="214" y="102" width="92" height="28" class="tile "/><text x="260" y="120.5" text-anchor="middle">She</text><rect x="314" y="102" width="92" height="28" class="tile "/><text x="360" y="120.5" text-anchor="middle">found</text><rect x="414" y="102" width="92" height="28" class="tile "/><text x="460" y="120.5" text-anchor="middle">the</text><rect x="514" y="102" width="92" height="28" class="tile "/><text x="560" y="120.5" text-anchor="middle">old</text><rect x="614" y="102" width="92" height="28" class="tile "/><text x="660" y="120.5" text-anchor="middle">map</text><text x="214" y="154" class="b s">What it could hear, and what the check finds</text><text x="202" y="183" class="s" text-anchor="end">A replaced word</text><rect x="214" y="164" width="92" height="28" class="tile "/><text x="260" y="182.5" text-anchor="middle">She</text><rect x="314" y="164" width="92" height="28" class="tile bad"/><text x="360" y="182.5" class="b" text-anchor="middle">felt</text><rect x="414" y="164" width="92" height="28" class="tile "/><text x="460" y="182.5" text-anchor="middle">the</text><rect x="514" y="164" width="92" height="28" class="tile "/><text x="560" y="182.5" text-anchor="middle">old</text><rect x="614" y="164" width="92" height="28" class="tile "/><text x="660" y="182.5" text-anchor="middle">map</text><text x="202" y="219" class="s" text-anchor="end">A dropped word</text><rect x="214" y="200" width="92" height="28" class="tile "/><text x="260" y="218.5" text-anchor="middle">She</text><rect x="314" y="200" width="92" height="28" class="tile "/><text x="360" y="218.5" text-anchor="middle">found</text><rect x="414" y="200" width="92" height="28" class="tile "/><text x="460" y="218.5" text-anchor="middle">the</text><rect x="514" y="200" width="92" height="28" class="tile hole"/><rect x="614" y="200" width="92" height="28" class="tile "/><text x="660" y="218.5" text-anchor="middle">map</text><text x="202" y="255" class="s" text-anchor="end">An extra phrase</text><rect x="214" y="236" width="92" height="28" class="tile "/><text x="260" y="254.5" text-anchor="middle">She</text><rect x="314" y="236" width="92" height="28" class="tile "/><text x="360" y="254.5" text-anchor="middle">found</text><rect x="414" y="236" width="92" height="28" class="tile "/><text x="460" y="254.5" text-anchor="middle">the</text><rect x="514" y="236" width="92" height="28" class="tile "/><text x="560" y="254.5" text-anchor="middle">old</text><rect x="614" y="236" width="92" height="28" class="tile "/><text x="660" y="254.5" text-anchor="middle">map</text><rect x="482" y="239" width="56" height="22" class="tile bad"/><text x="510" y="254.5" class="b" text-anchor="middle">very</text><text x="20" y="292" class="b s">Accepted:</text><text x="84" y="292" class="s">12 heard as twelve, spoken variants, listed name spellings. Title, byline and accent-only differences only advise.</text><path d="M380 302V326" class="mu-l"/><path d="M130 326H630" class="mu-l"/><path d="M130 326V352" class="li-l" marker-end="url(#a-li)"/><path d="M380 326V352" class="am-l" marker-end="url(#a-am)"/><path d="M630 326V352" class="am-l" marker-end="url(#a-am)"/><rect x="20" y="356" width="220" height="100" class="plate"/><text x="29" y="375" class="b s">No blocking difference</text><text x="29" y="390" class="s mu">Goes on to publish, labeled</text><text x="29" y="405" class="s mu">as needing a human check.</text><text x="29" y="420" class="s mu">Nobody has listened yet.</text><rect x="270" y="356" width="220" height="100" class="flag"/><text x="279" y="375" class="b s">A word differs</text><text x="279" y="390" class="s mu">The take is held, with reasons.</text><text x="279" y="405" class="s mu">It never reaches the reader, and</text><text x="279" y="420" class="s mu">an older voice can stay available.</text><rect x="520" y="356" width="220" height="106" class="flag"/><text x="529" y="375" class="b s">Recognition failed</text><text x="529" y="390" class="s mu">A failed or unreadable transcript</text><text x="529" y="405" class="s mu">in this check also holds the take.</text><text x="529" y="420" class="s mu">With Ruth, a failure getting word</text><text x="529" y="435" class="s mu">times ends earlier, as generation.</text><text x="20" y="484" class="xs mu">Recognition is evidence, not a judge of sound: it can mishear a name or an unusual word. A made-up sentence.</text></svg>
