<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-label="Editable Vue source is built with Vite in a staging folder. Once index.html and assets are checked, the build swaps the shell into the frontend folder, which also holds the passage data, audio and images that the build leaves in place. A separate publish command uploads the static site. The team reports the rebuilt shell and caption fix deployed on event AWS."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#ffe58a;--litink:#1d2730}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="344" class="bg"/><text x="20" y="27" class="era">The build replaces the shell and leaves the passage files alone</text><rect x="20" y="44" width="200" height="64" class="plate"/><text x="29" y="63" class="b s">frontend-src/</text><text x="29" y="78" class="s mu">Vue pages, player,</text><text x="29" y="93" class="s mu">styles, routes</text><path d="M220 76H284" class="li-l" marker-end="url(#a-li)"/><text x="252" y="68" class="xs li" text-anchor="middle">build</text><rect x="288" y="44" width="200" height="64" class="plate"/><text x="297" y="63" class="b s">Staged shell</text><text x="297" y="78" class="s mu">Check index.html</text><text x="297" y="93" class="s mu">and assets/ first</text><path d="M388 108V152" class="li-l" marker-end="url(#a-li)"/><text x="398" y="135" class="xs li">swapped in only if the check passes</text><rect x="20" y="154" width="500" height="150" class="plate"/><text x="32" y="174" class="b s">frontend/</text><text x="32" y="196" class="s li">Replaced by each build</text><rect x="34" y="204" width="100" height="28" class="tile "/><text x="84" y="222.5" text-anchor="middle">index.html</text><rect x="142" y="204" width="84" height="28" class="tile "/><text x="184" y="222.5" text-anchor="middle">assets/</text><rect x="234" y="204" width="130" height="28" class="tile "/><text x="299" y="222.5" text-anchor="middle">experiments.json</text><text x="32" y="258" class="s mu">Passage files: left where they are; the browser fetches them separately</text><rect x="28" y="266" width="484" height="30" class="sf"/><rect x="34" y="268" width="120" height="26" class="tile "/><text x="94" y="285.5" text-anchor="middle">data/index.json</text><rect x="162" y="268" width="120" height="26" class="tile "/><text x="222" y="285.5" text-anchor="middle">data/&lt;id>.json</text><rect x="290" y="268" width="70" height="26" class="tile "/><text x="325" y="285.5" text-anchor="middle">audio</text><rect x="368" y="268" width="70" height="26" class="tile "/><text x="403" y="285.5" text-anchor="middle">images</text><path d="M520 218H610" class="li-l" marker-end="url(#a-li)"/><text x="565" y="210" class="xs li" text-anchor="middle">publish</text><rect x="610" y="190" width="130" height="76" class="plate"/><text x="619" y="209" class="b s">Hosted site</text><text x="619" y="224" class="s mu">Separate publish</text><text x="619" y="239" class="s mu">command. Reported</text><text x="619" y="254" class="s mu">on event AWS.</text><text x="20" y="330" class="xs mu">The team reports the rebuilt shell and focused reader caption fix are deployed.</text></svg>
