<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" role="img" aria-label="The teacher demo uses invented Class 4B and fixed student results. Settings are applied from default through class, group, student, permitted choice and finally an accommodation lock. In the example a teacher turns read-aloud off but the sample reader’s lock turns it back on, and the local reader opens with resolved settings in its URL. This demo has no real roster, sign-in, live assignment or measured progress."><style>
svg{--bg:#fbfbf8;--sf:#eef1f2;--ink:#1d2730;--mu:#566370;--line:#a8b3ba;--li:#17557f;--am:#94651f;--rev:#fff4de;--lit:#ffe58a;--litink:#1d2730}
@media (prefers-color-scheme:dark){svg{--bg:#171d22;--sf:#28323a;--ink:#e6ebee;--mu:#a3b0ba;--line:#55636d;--li:#8cc6ec;--am:#d5b16e;--rev:#3e3526;--lit:#7a6517;--litink:#ffffff}}
text{font:13px "Segoe UI",system-ui,-apple-system,Arial,sans-serif;fill:var(--ink)}
.b{font-weight:650}.lg{font-size:15px;font-weight:650}.s{font-size:12px}.xs{font-size:11.5px}.mu{fill:var(--mu)}.li{fill:var(--li)}.am{fill:var(--am)}
.era{font:italic 14px Georgia,"Times New Roman",serif;fill:var(--mu)}.print{font:19px Georgia,"Times New Roman",serif}.mono{font:11.5px ui-monospace,Consolas,monospace;fill:var(--mu)}
.bg{fill:var(--bg)}.sf{fill:var(--sf)}.rev{fill:var(--rev)}.plate{fill:var(--bg);stroke:var(--line);stroke-width:1.25}.pivot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dash{fill:var(--bg);stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}.flag{fill:var(--rev);stroke:var(--am);stroke-width:2}.gone{fill:var(--sf);stroke:var(--line)}.lit{fill:var(--lit)}
.tile{fill:var(--bg);stroke:var(--line)}.tile.bad{fill:var(--rev);stroke:var(--am);stroke-width:2}.tile.hole{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--line)}.mu-l{fill:none;stroke:var(--mu);stroke-width:1.5}.li-l{fill:none;stroke:var(--li);stroke-width:2}.li-d{fill:none;stroke:var(--li);stroke-width:1.5;stroke-dasharray:6 4}
.am-l{fill:none;stroke:var(--am);stroke-width:2}.am-d{fill:none;stroke:var(--am);stroke-width:2;stroke-dasharray:6 5}.halo{fill:none;stroke:var(--bg);stroke-width:7}
.bars{stroke:var(--li);stroke-width:2;fill:none;stroke-linecap:round}.fli{fill:var(--li)}.fam{fill:var(--am)}.fmu{fill:var(--mu)}.fline{fill:var(--line)}</style><defs><marker id="a-mu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--mu)"/></marker><marker id="a-li" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--li)"/></marker><marker id="a-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--am)"/></marker></defs><rect x="0" y="0" width="760" height="385" class="bg"/><text x="20" y="25" class="b am">Demo only: invented Class 4B, fixed student results</text><rect x="20" y="52" width="112" height="84" class="plate"/><text x="29" y="74" class="b s">Default</text><text x="29" y="97" class="xs">read aloud on</text><path d="M132 94H142" class="li-l" marker-end="url(#a-li)"/><rect x="143" y="52" width="112" height="84" class="plate"/><text x="152" y="74" class="b s">Class</text><text x="152" y="97" class="xs">teacher toggles off</text><path d="M255 94H265" class="li-l" marker-end="url(#a-li)"/><rect x="266" y="52" width="112" height="84" class="plate"/><text x="275" y="74" class="b s">Group</text><text x="275" y="97" class="xs">no change</text><path d="M378 94H388" class="li-l" marker-end="url(#a-li)"/><rect x="389" y="52" width="112" height="84" class="plate"/><text x="398" y="74" class="b s">Student</text><text x="398" y="97" class="xs">no change</text><path d="M501 94H511" class="li-l" marker-end="url(#a-li)"/><rect x="512" y="52" width="112" height="84" class="plate"/><text x="521" y="74" class="b s">Choice</text><text x="521" y="97" class="xs">not adjustable</text><path d="M624 94H634" class="li-l" marker-end="url(#a-li)"/><rect x="635" y="52" width="112" height="84" class="flag"/><text x="644" y="74" class="b s">Lock</text><text x="644" y="97" class="xs">read aloud on</text><text x="686" y="170" class="xs li" text-anchor="end">resolved settings</text><text x="20" y="159" class="s">Sample reader: the accommodation lock applies last and keeps read-aloud on.</text><path d="M694 137V204" class="li-l" marker-end="url(#a-li)"/><rect x="394" y="208" width="346" height="89" class="plate"/><text x="408" y="233" class="b s">Reader link opens the real local reader</text><text x="408" y="255" class="s">with resolved settings in the URL.</text><text x="408" y="277" class="s mu">This is client-side demo state.</text><rect x="20" y="208" width="354" height="89" class="sf"/><text x="34" y="233" class="b s">Presentation screens</text><text x="34" y="255" class="s">Teacher, three students, content team</text><text x="34" y="277" class="s mu">Roster, progress and class words are fixed.</text><rect x="20" y="318" width="720" height="55" class="rev"/><text x="34" y="340" class="s">No roster sign-in, live assignment, measured progress or working content console.</text><text x="34" y="359" class="s mu">No server authorization is shown by this demo.</text></svg>
